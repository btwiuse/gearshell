    <script>
    if (window.location.search.includes("debug")) {
      window.homeDebugErrors = [];
      window.addEventListener("error", function (event) {
        var error = event.error;
        var details = error && (error.stack || error.message);
        window.homeDebugErrors.push(
          "Error: " + (details || event.message || "Unknown error"),
        );
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason;
        var details = reason && (reason.stack || reason.message || String(reason));
        window.homeDebugErrors.push(
          "Unhandled rejection: " + (details || "Unknown error"),
        );
      });
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/eruda/eruda.js";
      s.onload = function () {
        eruda.init();
      };
      document.head.appendChild(s);
    }
    </script>
