<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notes</title>
<link rel="stylesheet" href="/plugin/notes/notes.css" />
<style>
html, body, #app {
  width: 100%; height: 100%; margin: 0; overflow: hidden;
  overscroll-behavior: none;
}
html, body { max-height: 100vh; }
body {
  background: #fbf9f4; color: #2c2a26;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  font-size: 14px !important;
}
</style>
<!-- buildless iframe plugin: the importmap resolves React, htm, and
     lucide-react from esm.sh. /plugin/gear-bridge.js installs
     window.GearShell on this iframe; every method call becomes a
     postMessage round-trip to the parent shell — gated by this plugin's
     permissions.api whitelist. The plugin's JS is split across
     notes.js (utilities), notes-storage.js (fs + kv persistence),
     notes-store.js (CRUD hook), notes-components.js (presentation),
     and notes-bootstrap.js (entry point), keeping each file under
     the 500-line rule. Persistence is hybrid: metadata (folders,
     note index, pin list, id counter) lives in the per-workspace
     config.kv store and the note bodies are individual markdown
     files under /opfs/home/notes/<folder-slug>/<slug>.md. Live
     sync listens for both "config.changed" (kv writes) and
     "fs.changed" (FileSystemObserver on /opfs/home/notes), so an
     external editor ("vim foo.md" in a terminal, the Files panel
     editor, an agent) reflects in the Notes UI without a reload. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "htm": "https://esm.sh/htm@3.1.1",
    "lucide-react": "https://esm.sh/lucide-react@0.468.0?deps=react@18.2.0"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<script src="/plugin/gear-bridge.js"></script>
<script type="module" src="/plugin/notes/notes-bootstrap.js"></script>
</body>
</html>
