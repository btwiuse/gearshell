<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rv64.js — RISC-V 64 Linux</title>
<link rel="stylesheet" href="/plugin/rv64/rv64.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.1.0-beta.304/css/xterm.css" />
<style>
  #rv64-term {
    flex: 1;
    min-width: 0;
    min-height: 0;
    height: 100%;
  }
  #rv64-term .xterm { height: 100%; }
</style>
</head>
<body>
  <div id="app">
    <header class="rv64-head">
      <span class="rv64-dots"><i></i><i></i><i></i></span>
      <span class="rv64-title">rv64.js · Alpine Linux (RISC-V 64)</span>
      <span id="rv64-status" class="rv64-status" data-mode="loading">loading…</span>
    </header>
    <div id="rv64-host" class="rv64-host">
      <div id="rv64-term"></div>
    </div>
  </div>

  <script src="/plugin/gear-bridge.js"></script>
  <script>
    (function () {
      "use strict";

      // The VM runs in the HOST wanix kernel (the same instance the shell
      // and panels use): vm.create spawns it there and this page renders a
      // bare xterm that streams the VM's term device over the bridge.
      var XTERM_BUNDLE = "/plugin/xterm-bundle.mjs";
      var VNET_URL = "wss://vnet.net.k0s.io/x/net";
      // rv64-specific assets live with the plugin: rv64.tgz is the WANIX
      // rv64 adapter (emulator WASM + loader), and wanix-linux-rv64.tgz is
      // the RISC-V Alpine guest built by rv64.js/integrations/wanix.
      var RV64_BACKEND_URL =
        "https://cdn.jsdelivr.net/gh/btwiuse/wanix-extras@v0.4.0-rc6/rv64.tgz";
      var RV64_LINUX_URL =
        "https://cdn.jsdelivr.net/gh/btwiuse/wanix-extras@v0.4.0-rc6/wanix-linux-rv64.tgz";

      var state = {
        sessionId: null,
        xterm: null,
        fit: null,
        disposed: true,
        dataHandler: null,
        exitHandler: null,
        resizeObserver: null,
        resizeFrame: 0,
      };

      function $(id) { return document.getElementById(id); }

      function setStatus(mode, text) {
        var status = $("rv64-status");
        status.dataset.mode = mode;
        status.textContent = text;
      }

      function writeToXterm(bytes) {
        if (state.xterm) state.xterm.write(bytes);
      }

      // Mobile tap-to-refocus: touch browsers may not synthesize the mousedown
      // xterm listens for after the terminal lost focus, so a tap would never
      // reopen the keyboard. Focus directly on a tap; scrolls are ignored.
      function enableTapFocus(term, host) {
        var touchStart = null;
        host.addEventListener("touchstart", function (event) {
          var t = event.changedTouches[0];
          if (t) touchStart = { x: t.clientX, y: t.clientY };
        }, { passive: true });
        host.addEventListener("touchend", function (event) {
          if (!touchStart) return;
          var t = event.changedTouches[0];
          var moved = t
            ? Math.abs(t.clientX - touchStart.x) + Math.abs(t.clientY - touchStart.y)
            : 0;
          touchStart = null;
          if (moved < 12) term.focus();
        }, { passive: true });
      }

      function termWrite(data) {
        if (!state.sessionId) return;
        GearShell.terminal.write(
          state.sessionId,
          new TextEncoder().encode(data),
        ).catch(function () {});
      }

      function termResize() {
        if (!state.xterm || !state.sessionId) return;
        GearShell.terminal.resize(
          state.sessionId,
          state.xterm.cols,
          state.xterm.rows,
        ).catch(function () {});
      }

      function refitAndResize() {
        if (!state.fit || !state.xterm) return;
        try {
          state.fit.fit();
        } catch {
          return;
        }
        termResize();
      }

      function onTermData(event) {
        if (!event || event.sessionId !== state.sessionId) return;
        writeToXterm(event.data);
        if ($("rv64-status").dataset.mode === "loading") {
          setStatus("ready", "ready · network connected");
        }
      }

      function onTermExit(event) {
        if (!event || event.sessionId !== state.sessionId) return;
        setStatus("error", "VM stopped" + (event.error ? ": " + event.error : ""));
      }

      function start() {
        if (state.sessionId) return;
        setStatus("loading", "starting…");
        Promise.all([
          import(XTERM_BUNDLE).then(function (m) {
            return m.loadXtermBundle().then(function (libs) {
              libs.apply = m.applyXtermAddons;
              return libs;
            });
          }),
          GearShell.subscribe("term.data"),
          GearShell.subscribe("term.exit"),
        ]).then(function (results) {
          var libs = results[0];
          state.xterm = new libs.Terminal({
            allowProposedApi: true,
            fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
            fontSize: 13,
            cursorBlink: true,
            convertEol: true,
            scrollback: 10000,
            theme: {
              background: "#0a0e14",
              foreground: "#e6edf3",
              cursor: "#58a6ff",
              selectionBackground: "#1f6feb66",
            },
          });
          state.fit = new libs.FitAddon();
          state.xterm.loadAddon(state.fit);
          state.xterm.open($("rv64-term"));
          libs.apply(state.xterm, libs);
          enableTapFocus(state.xterm, $("rv64-term"));
          state.xterm.onData(termWrite);
          state.xterm.onResize(termResize);
          state.dataHandler = onTermData;
          state.exitHandler = onTermExit;
          GearShell.on("term.data", state.dataHandler);
          GearShell.on("term.exit", state.exitHandler);
          state.resizeObserver = new ResizeObserver(function () {
            window.clearTimeout(state.resizeFrame);
            state.resizeFrame = window.setTimeout(refitAndResize, 80);
          });
          state.resizeObserver.observe($("rv64-term"));
          refitAndResize();
        }).then(function () {
          return GearShell.vm.create({
            type: "rv64",
            backendUrl: RV64_BACKEND_URL,
            linuxUrl: RV64_LINUX_URL,
            // Same shared vnet gateway as the v86 plugin: the adapter routes
            // the guest NIC through it (rv64.js wsproxy mode), and the guest
            // boot rc runs DHCP to pick up an address + DNS.
            netdev: "user,type=virtio,relay_url=" + VNET_URL,
            bootRc: "/plugin/rv64/guest-boot-rc",
            postDhcp: "/plugin/rv64/guest-post-dhcp",
          });
        }).then(function (result) {
          if (!result || result.ok === false) {
            throw new Error((result && result.error) || "vm.create failed");
          }
          state.sessionId = result.sessionId;
          setStatus("loading", "booting Alpine (RISC-V 64)…");
          return GearShell.terminal.resize(
            state.sessionId,
            state.xterm.cols,
            state.xterm.rows,
          ).catch(function () { /* non-fatal: winch races the term */ });
        }).catch(function (error) {
          console.error("rv64 start failed", error);
          setStatus("error", "failed: " + (error.message || error));
          writeToXterm("\r\n\x1b[31mrv64 failed to start: " +
            (error.message || error) + "\x1b[0m\r\n");
        });
      }

      start();
    })();
  </script>
</body>
</html>
