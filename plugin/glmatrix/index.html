<!doctype html>
<html>
<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #about-link {
      position: fixed;
      right: 15px;
      bottom: 15px;
      z-index: 2;
      padding: 0;
      border: 0;
      color: rgba(107, 165, 184, .8);
      background: transparent;
      font: 15px Menlo, Consolas, monospace;
      cursor: pointer;
      text-shadow: 0 0 15px rgba(107, 165, 184, .8);
    }
    #about-link:hover { color: #d7f5ff; }
    #about-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, .28);
    }
    #about-backdrop[hidden], #about-modal[hidden] { display: none; }
    #about-modal {
      position: fixed;
      z-index: 11;
      left: 50%;
      top: 50%;
      width: min(390px, calc(100vw - 32px));
      transform: translate(-50%, -50%);
      color: #f5f5f7;
      background: rgba(39, 39, 43, .96);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .7), 0 0 1px #fff;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      overflow: hidden;
    }
    #about-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      padding: 0 12px 0 18px;
      background: rgba(255, 255, 255, .07);
      cursor: move;
      touch-action: none;
    }
    #about-header strong { font-size: 13px; font-weight: 600; }
    #about-close {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      color: #ddd;
      background: rgba(255, 255, 255, .12);
      font-size: 18px;
      line-height: 20px;
      cursor: pointer;
    }
    #about-close:hover { background: #ff5f57; color: #40100d; }
    #about-body { padding: 25px 28px 27px; text-align: center; }
    #about-logo { width: 96px; height: 96px; margin-bottom: 14px; border-radius: 22px; }
    #about-body h1 { margin: 0; font-size: 23px; font-weight: 600; letter-spacing: -.4px; }
    #about-body p { margin: 8px 0 0; color: #c8c8cc; line-height: 1.45; }
    #about-details { margin: 21px 0 0; padding-top: 17px; border-top: 1px solid rgba(255, 255, 255, .14); color: #c8c8cc; line-height: 1.65; }
    #about-details b { color: #f5f5f7; font-weight: 500; }
  </style>
  <script src="digitalrain.bundle.js"></script>
</head>
<body>
  <button id="about-link" type="button" aria-haspopup="dialog">About</button>
  <div id="about-backdrop" hidden></div>
  <section id="about-modal" role="dialog" aria-modal="true" aria-labelledby="about-title" hidden>
    <header id="about-header">
      <strong>About</strong>
      <button id="about-close" type="button" aria-label="Close">×</button>
    </header>
    <div id="about-body">
      <img id="about-logo" src="/logo-512.png" alt="GearShell logo">
      <h1 id="about-title">GearShell</h1>
      <p>Web Native Agent Sandbox</p>
      <div id="about-details">
        <div>Browser-native tools, agents, and workspaces</div>
        <div>Version 1.0</div>
      </div>
    </div>
  </section>
  <script>
    const link = document.getElementById("about-link");
    const modal = document.getElementById("about-modal");
    const backdrop = document.getElementById("about-backdrop");
    const close = document.getElementById("about-close");
    const header = document.getElementById("about-header");
    const show = () => { modal.hidden = false; backdrop.hidden = false; close.focus(); };
    const hide = () => { modal.hidden = true; backdrop.hidden = true; };
    link.onclick = show;
    close.onclick = hide;
    backdrop.onclick = hide;
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !modal.hidden) hide();
    });
    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;
    let frame = 0;
    let nextLeft = 0;
    let nextTop = 0;
    const paintPosition = () => {
      frame = 0;
      if (!dragging) return;
      modal.style.transform = `translate3d(${nextLeft}px, ${nextTop}px, 0)`;
    };
    header.addEventListener("pointerdown", (event) => {
      if (event.target === close) return;
      event.preventDefault();
      const rect = modal.getBoundingClientRect();
      dragging = true;
      offsetX = event.clientX - rect.left;
      offsetY = event.clientY - rect.top;
      nextLeft = rect.left;
      nextTop = rect.top;
      modal.style.left = "0px";
      modal.style.top = "0px";
      modal.style.transform = `translate3d(${nextLeft}px, ${nextTop}px, 0)`;
      header.setPointerCapture(event.pointerId);
    });
    header.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      nextLeft = event.clientX - offsetX;
      nextTop = event.clientY - offsetY;
      if (!frame) frame = requestAnimationFrame(paintPosition);
    });
    const stopDragging = () => {
      dragging = false;
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
    };
    header.addEventListener("pointerup", stopDragging);
    header.addEventListener("pointercancel", stopDragging);
  </script>
</body>
</html>
