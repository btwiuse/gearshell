<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QEMU Playground</title>
  <link rel="stylesheet" href="/plugin/qemu-playground/qemu-playground.css">
  <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css">
</head>
<body>
  <main class="playground">
    <header>
      <div><span class="eyebrow">EXPERIMENTAL BACKEND</span><h1>QEMU Playground</h1></div>
      <span id="status" data-mode="loading">loading runtime…</span>
    </header>
    <p>QEMU-Wasm x86_64 Alpine reference bundle. This isolated demo does not use WANIX, OCI rootfs, 9P, or the VNet relay.</p>
    <div id="terminal"></div>
  </main>
  <script type="module" src="/plugin/qemu-playground/qemu-playground.js"></script>
</body>
</html>
