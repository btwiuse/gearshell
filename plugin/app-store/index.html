<!-- buildless iframe plugin: the importmap resolves React, htm, and
     lucide-react from esm.sh, and /plugin/gear-bridge.js (loaded as a
     classic script) installs window.GearShell on this iframe so every
     method call becomes a postMessage to the parent shell — gated by
     this plugin's permissions.api whitelist. The shell's
     config.plugins.{list, install, remove, setEnabled} and
     panels.{list, open, close, focus} are already exposed; this page
     adds tag-filter and List/Card view on top. -->
<script type="importmap">
{

<body>
<div id="app"></div>
<script src="/plugin/gear-bridge.js"></script>
<script type="module">
import React, { useEffect, useMemo, useRef, useState } from "react";
import { createRoot } from "react-dom/client";
import htm from "htm";
import * as Lucide from "lucide-react";
import {
  Search,
  LayoutGrid,
  List,
  Plus,
  Store,
  Pencil,
  Trash2,
  ExternalLink,
  AlertTriangle,
  Check,
  ShieldCheck,
  ChevronRight,
  ChevronDown,
  KeyRound,
  X,
} from "lucide-react";

const html = htm.bind(React.createElement);

// Every prop name returned by lucide-react forwardRef icons is
// PascalCase. We strip the deprecated "XIcon" suffix aliases and any
// non-icon helper exports (defaultAttributes, icons, etc.) so the
// App Store's icon picker shows canonical names only.
const LUCIDE_ICONS = Object.keys(Lucide)
  .filter((name) => /^[A-Z]/.test(name) && name !== "defaultAttributes")
  .filter((name) => !name.endsWith("Icon"))
  .sort();

function iconOf(name) {
  return Lucide[name] || Lucide.Wrench;
}

// Plugin kind tag (matches normalizePlugin's derived "iframe" /
// "component" / "builtin"). Used for the badge color and the always-on
// kind chip at the top of the filter bar.
function kindOf(plugin) {
  if (plugin.iframe) return "iframe";
  if (plugin.entry) return "component";
  return "builtin";
}

// --- Permission catalog ---
// Human-readable one-liner per namespace plus a short list of the most
// common method paths so chips show a hint at a glance. Wildcards like
// "fs.*" stay literal — the bridge check permitsPath matches exact or
// "ns.*" suffix, and we render them verbatim. The catalog is best-effort:
// any api path the plugin declares but we don't list falls back to a
// generic description ("custom method") so the chip never goes blank.
const PERMISSION_CATALOG = {

    methods: {

      workspaces: "List, create and switch workspaces.",
      workspace: "Read or delete the active workspace.",

      audit: "Read or clear the agent activity ring buffer.",
      auditClear: "Clear the agent activity ring buffer.",

    methods: {

      writeText: "Write a UTF-8 text file.",
      readBinary: "Read a binary file as Uint8Array.",
      writeBinary: "Write a binary file from Uint8Array.",
      readdir: "List a directory.",
      mkdir: "Create a directory.",
      remove: "Delete a file or directory.",
      stat: "Read file metadata (size, mode, type).",
      rename: "Rename or move a file.",
      copy: "Copy a file.",

      unwatch: "Cancel a filesystem watch handle.",
    },
  },

    methods: {

    },
  },
  vm: {

    blurb: "Boot and control the in-page x86 (v86) / RISC-V (rv64) virtual machines.",
    methods: {

      reset: "Reset a running VM.",
      destroy: "Tear a VM down.",
      input: "Send keyboard / mouse input.",
      key: "Press a single key.",
      pause: "Pause the VM clock.",
      resume: "Resume the VM clock.",

    },
  },
  music: {

    blurb: "Drive the built-in music player (library, queue, playback, lyrics).",
    methods: {

      prev: "Jump back to the previous track.",

    },
  },

function describePermission(path) {
  const [ns, ...rest] = path.split(".");
  const entry = PERMISSION_CATALOG[ns];
  if (!entry) return { ns: ns || "?", label: ns || "Custom", method: path, blurb: "Custom method path — not in the built-in catalog." };
  const method = rest.join(".");
  const methodBlurb = entry.methods[method];
  return {
    ns,
    label: entry.label,
    method,
    methodLabel: method || "(whole namespace)",
    blurb: methodBlurb || entry.blurb,
  };
}

function summarizePermissions(plugin) {
  const list = plugin?.permissions?.api || [];
  const wildcards = [];
  const others = [];
  for (const p of list) {
    if (p.endsWith(".*")) wildcards.push(p);
    else others.push(p);
  }
  return { list, wildcards, others };
}

function groupByNamespace(perms) {
  const groups = new Map();
  for (const p of perms) {
    const ns = p.split(".")[0] || "?";
    if (!groups.has(ns)) groups.set(ns, []);
    groups.get(ns).push(p);
  }
  return [...groups.entries()].map(([ns, paths]) => ({
    ns,
    label: PERMISSION_CATALOG[ns]?.label || ns,
    blurb: PERMISSION_CATALOG[ns]?.blurb || "Custom namespace — methods on this path are gated to this plugin.",
    paths,
  }));
}

// --- Filter / view state ---
function useStore() {
  const [plugins, setPlugins] = useState([]);
  const [view, setView] = useState("grid");
  const [query, setQuery] = useState("");
  const [activeTags, setActiveTags] = useState([]); // string[]
  const [notice, setNotice] = useState(null); // {kind, text}
  const [modal, setModal] = useState(null); // {mode, plugin?}
  // PermFilter: a parsed `perm:` prefix from the search box — filters
  // plugins that request this exact api path (or whose permissions
  // include a wildcard that matches it). `perm:` alone matches any
  // plugin that requests at least one permission.
  const [expandedRows, setExpandedRows] = useState(() => new Set());
  const [detailPlugin, setDetailPlugin] = useState(null);

  const refresh = async () => {
    // The gear bridge only installs window.GearShell inside an iframe
    // (window.top !== window.self). When this page is opened directly in
    // a browser tab for development, the bridge guard skips installation
    // and GearShell stays undefined — fall back to an empty state so the
    // React tree still renders an explanatory empty card.
    if (typeof GearShell === "undefined") {
      setPlugins([]);
      return;
    }
    // The bridge Proxy turns every GearShell.* call into an async
    // postMessage round-trip, so `list()` returns a Promise, not an
    // array. Await it — the in-page Plugins page can read configApi
    // synchronously, but an iframe plugin has to await the round-trip.
    try {
      const result = await GearShell.config.plugins.list();
      setPlugins(Array.isArray(result) ? result : []);
    } catch {
      setPlugins([]);
    }
  };
  // Track bridge presence so the empty-state card can hint at it.
  const bridgeAvailable = typeof GearShell !== "undefined";
  useEffect(() => {
    refresh();
    // Re-render when the kernel hot-installs/loads/disables a plugin
    // and when config changes anywhere (Settings toggle etc.).
    const reload = () => refresh();
    if (typeof GearShell === "undefined") return;
    GearShell.events.on("plugins.changed", reload);
    GearShell.events.on("config.changed", reload);
    return () => {
      GearShell.events.off("plugins.changed", reload);
      GearShell.events.off("config.changed", reload);
    };
  }, []);

  const allTags = useMemo(() => {
    const counts = new Map();
    for (const p of plugins) for (const t of p.tags || []) {
      counts.set(t, (counts.get(t) || 0) + 1);
    }
    return [...counts.entries()]
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  }, [plugins]);

  const visible = useMemo(() => {
    const raw = query.trim();
    let text = raw;
    let permFilter = null; // string | null
    if (raw.startsWith("perm:")) {
      const rest = raw.slice(5).trim();
      text = "";
      permFilter = rest || "*"; // empty "perm:" = "any perm declared"
    }
    const q = text.toLowerCase();
    return plugins.filter((p) => {
      if (q) {
        const hay = [p.name, p.id, p.description]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (activeTags.length) {
        const have = new Set(p.tags || []);
        for (const t of activeTags) if (!have.has(t)) return false;
      }
      if (permFilter !== null) {
        const api = p.permissions?.api || [];
        if (permFilter === "*") {
          if (api.length === 0) return false;
        } else if (!api.some((rule) => {
          if (rule === permFilter) return true;
          if (rule.endsWith(".*")) {
            const ns = rule.slice(0, -2);
            return permFilter === ns || permFilter.startsWith(ns + ".");
          }
          return false;
        })) {
          return false;
        }
      }
      return true;
    });
  }, [plugins, query, activeTags]);

  const toggleTag = (tag) => {
    setActiveTags((prev) =>
      prev.includes(tag) ? prev.filter((t) => t !== tag) : [...prev, tag],
    );
  };

  const toggleExpandedRow = (id) => {
    setExpandedRows((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const openDetail = (plugin) => setDetailPlugin(plugin);
  const closeDetail = () => setDetailPlugin(null);

  const flash = (result, okText) => {
    if (result && result.ok === false) {
      setNotice({ kind: "error", text: result.error || "Failed." });
    } else if (result?.error) {
      setNotice({ kind: "error", text: result.error });
    } else {
      setNotice({ kind: "ok", text: okText });
    }
    setTimeout(() => setNotice(null), 2400);
  };

  return {
    plugins,
    visible,
    view,
    setView,
    query,
    setQuery,
    activeTags,
    toggleTag,
    allTags,
    notice,
    setNotice,
    modal,
    setModal,
    expandedRows,
    toggleExpandedRow,
    detailPlugin,
    openDetail,
    closeDetail,
    flash,
    refresh,
  };
}

// --- Actions: enable/disable, remove, open, submit ---
function useActions(store) {
  const { flash, refresh, setModal } = store;

  const onToggle = async (plugin) => {
    try {
      const result = await GearShell.config.plugins.setEnabled(
        plugin.id,
        !plugin.enabled,
      );
      flash(result, `${plugin.name} ${plugin.enabled ? "disabled" : "enabled"}.`);
      refresh();
    } catch (error) {
      flash({ error: error?.message || String(error) });
    }
  };

  const onRemove = async (plugin) => {
    if (!window.confirm(`Remove "${plugin.name}"?`)) return;
    try {
      const result = await GearShell.config.plugins.remove(plugin.id);
      flash(result, `${plugin.name} removed.`);
      refresh();
    } catch (error) {
      flash({ error: error?.message || String(error) });
    }
  };

  const onOpen = async (plugin) => {
    // The plugin exposes one or more panels via plugin.panels; opening
    // the first one is the Launcher-equivalent behavior.
    if (!plugin.enabled) {
      flash({ error: "Enable the plugin before opening it." });
      return;
    }
    const id = (plugin.panels && plugin.panels[0]) || plugin.id;
    try {
      const result = await GearShell.panels.open(id);
      if (result?.ok === false) {
        flash({ error: result.error || "Could not open plugin." });
      }
    } catch (error) {
      flash({ error: error?.message || String(error) });
    }
  };

  const onSubmit = async (values, kind) => {
    const manifest = {
      id: values.id.trim(),
      name: values.name.trim(),
      version: values.version.trim() || "1.0.0",
      icon: values.icon.trim() || "Wrench",
      tags: values.tags
        .split(/[,\n]+/)
        .map((s) => s.trim())
        .filter(Boolean),
    };
    const permissions = values.permissions
      .split(/\n+/)
      .map((s) => s.trim())
      .filter(Boolean);
    if (permissions.length) manifest.permissions = { api: permissions };
    if (kind === "iframe") {
      const src = values.src.trim();
      if (!src) {
        flash({ error: "Iframe src is required." });
        return;
      }
      manifest.iframe = { src };
      if (values.allow.trim()) manifest.iframe.allow = values.allow.trim();
      if (values.allowFullscreen) manifest.iframe.allowFullscreen = true;
    } else if (kind === "component") {
      if (!values.entry.trim()) {
        flash({ error: "Component entry URL is required." });
        return;
      }
      manifest.entry = values.entry.trim();
    } else {
      flash({ error: "Pick a kind first." });
      return;
    }
    try {
      const result = await GearShell.config.plugins.install(manifest);
      flash(
        result,
        result?.ok === false ? null : `${manifest.name} installed. Loading…`,
      );
      setModal(null);
      refresh();
    } catch (error) {
      flash({ error: error?.message || String(error) });
    }
  };

  return { onToggle, onRemove, onOpen, onSubmit };
}

// --- Components ---
function NoticeBar({ notice }) {
  return html`<div className=${"as-notice " + (notice?.kind || "") + (notice ? " show" : "")}>
    ${notice?.kind === "error"
      ? html`<${AlertTriangle} size=${13} aria-hidden=${true}/>`
      : html`<${Check} size=${13} aria-hidden=${true}/>`}
    <span style=${{ marginLeft: 6 }}>${notice?.text || ""}</span>
  </div>`;
}

function TagChips({ allTags, activeTags, onToggle }) {
  if (!allTags.length) return null;
  return html`<div className="as-tags">
    ${allTags.map(([tag, count]) => html`<button
      key=${tag}
      type="button"
      className=${"as-tag " + (activeTags.includes(tag) ? "active" : "")}
      onClick=${() => onToggle(tag)}
    >${tag}<span className="as-tag-count">${count}</span></button>`)}
  </div>`;
}

function ToggleSwitch({ checked, disabled, onChange, label }) {
  return html`<button
    type="button"
    className="as-switch"
    role="switch"
    aria-checked=${checked ? "true" : "false"}
    aria-label=${label}
    title=${label}
    disabled=${disabled}
    onClick=${onChange}
  ></button>`;
}

// --- Permission display ---
// Compact chip that shows a permission path; clicking it sets the
// search filter to that exact path (perm:<path>) so the user can pivot
// from "this plugin uses X" to "what else uses X?". On the detail modal
// and the expanded row the chips are non-interactive — they're
// documentation, not filters.
function PermissionChip({ path, onClick, title }) {
  const meta = describePermission(path);
  const t = title || meta.blurb;
  const className = "as-perm-chip" + (path.endsWith(".*") ? " wildcard" : "");
  if (!onClick) {
    return html`<span className=${className} title=${t}>
      <span className="as-perm-chip-ns">${meta.label}</span>
      <span className="as-perm-chip-method">${meta.methodLabel}</span>
    </span>`;
  }
  return html`<button
    type="button"
    className=${className}
    title=${t}
    onClick=${onClick}
  >
    <span className="as-perm-chip-ns">${meta.label}</span>
    <span className="as-perm-chip-method">${meta.methodLabel}</span>
  </button>`;
}

// One-line summary for the card footer or list-row caption. Shows the
// first 2 permissions (sorted by namespace), then a "+N more" hint when
// the manifest declares more. No chips if the plugin asks for nothing.
function PermissionSummary({ plugin, onChipClick, max = 2 }) {
  const { list } = summarizePermissions(plugin);
  if (list.length === 0) {
    return html`<span className="as-perm-summary none">
      <${ShieldCheck} size=${11} aria-hidden=${true}/>
      No API permissions requested.
    </span>`;
  }
  const sorted = [...list].sort((a, b) => a.localeCompare(b));
  const shown = sorted.slice(0, max);
  const rest = sorted.length - shown.length;
  return html`<div className="as-perm-summary">
    <${ShieldCheck} size=${11} aria-hidden=${true} className="as-perm-summary-icon"/>
    <span className="as-perm-summary-label">Permissions:</span>
    ${shown.map((p) => html`<${PermissionChip} key=${p} path=${p} onClick=${onChipClick}/>`)}
    ${rest > 0 ? html`<button type="button" className="as-perm-more" onClick=${onChipClick}>+${rest} more</button>` : null}
  </div>`;
}

// Full grouped view for the detail modal and the list-row expansion.
// One section per namespace, with a one-line blurb and every declared
// path listed (chips are non-interactive).
function PermissionPanel({ plugin }) {
  const { list } = summarizePermissions(plugin);
  if (list.length === 0) {
    return html`<div className="as-perm-panel empty">
      <${ShieldCheck} size=${16} aria-hidden=${true}/>
      <div>
        <strong>No API permissions requested.</strong>
        <p>This plugin runs in the same origin as the shell. It can read DOM and call bridge methods only inside its iframe.</p>
      </div>
    </div>`;
  }
  const groups = groupByNamespace(list);
  return html`<div className="as-perm-panel">
    <div className="as-perm-panel-head">
      <${ShieldCheck} size=${14} aria-hidden=${true}/>
      <strong>${list.length} API permission${list.length === 1 ? "" : "s"} requested</strong>
    </div>
    ${groups.map((g) => html`<section key=${g.ns} className="as-perm-group">
      <header className="as-perm-group-head">
        <span className="as-perm-group-label">${g.label}</span>
        <span className="as-perm-group-ns">${g.ns}</span>
      </header>
      <p className="as-perm-group-blurb">${g.blurb}</p>
      <div className="as-perm-chips">
        ${g.paths.map((p) => html`<${PermissionChip} key=${p} path=${p}/>`)}
      </div>
    </section>`)}
  </div>`;
}

// Detail modal shown from the grid view: clicking the card body or the
// "Permissions" button opens it. The card's action buttons (Open / Edit
// / Remove) keep working without opening the modal — they're separate
// stop-propagation handlers.
function PluginDetailModal({ plugin, onClose, onOpen }) {
  if (!plugin) return null;
  const Icon = iconOf(plugin.icon);
  const kind = kindOf(plugin);
  return html`<div className="as-modal-back" onClick=${onClose}>
    <div className="as-modal as-detail-modal" onClick=${(e) => e.stopPropagation()}>
      <button type="button" className="as-detail-close" onClick=${onClose} title="Close" aria-label="Close">
        <${X} size=${14} aria-hidden=${true}/>
      </button>
      <header className="as-detail-head">
        <div className="as-detail-icon"><${Icon} size=${48} aria-hidden=${true}/></div>
        <div className="as-detail-meta">
          <h2>${plugin.name || plugin.id}</h2>
          <div className="as-detail-sub">${plugin.id} · v${plugin.version}</div>
          <${Badges} plugin=${plugin}/>
        </div>
        <button
          type="button"
          className="as-btn primary"
          disabled=${!plugin.enabled}
          title=${plugin.enabled ? `Open ${plugin.name}` : `Enable ${plugin.name} first`}
          onClick=${() => { onClose(); onOpen(plugin); }}
        ><${ExternalLink} size=${12} aria-hidden=${true}/> Open</button>
      </header>
      ${plugin.description ? html`<p className="as-detail-desc">${plugin.description}</p>` : null}
      ${plugin.loadError ? html`<p className="as-detail-desc" style=${{ color: "#f85149" }}>${plugin.loadError}</p>` : null}
      <${PermissionPanel} plugin=${plugin}/>
    </div>
  </div>`;
}

function Badges({ plugin }) {
  const kind = kindOf(plugin);
  const tags = (plugin.tags || []).filter((t) => t !== kind);
  return html`<div className="as-card-badges">
    <span className=${"as-badge " + kind}>${kind}</span>
    <span className=${"as-badge " + (plugin.enabled ? "enabled" : "disabled")}>${plugin.enabled ? "enabled" : "disabled"}</span>
    ${plugin.required ? html`<span className="as-badge required">required</span>` : null}
    ${plugin.builtin ? html`<span className="as-badge builtin">built-in</span>` : null}
    ${plugin.loadError ? html`<span className="as-badge load-error">load-error</span>` : null}
    ${tags.map((t) => html`<span key=${t} className="as-badge">${t}</span>`)}
  </div>`;
}

function PluginCardGrid({ plugin, onToggle, onEdit, onRemove, onOpen, onShowDetail, onChipClick }) {
  const Icon = iconOf(plugin.icon);
  const perms = plugin.permissions?.api || [];
  return html`<article className=${"as-card " + (plugin.enabled ? "" : "is-disabled") + (plugin.loadError ? " has-error" : "")}>
    <div className="as-card-logo"><${Icon} size=${64} aria-hidden=${true}/></div>
    <div className="as-card-body">
      <div className="as-card-top">
        <div className="as-card-head">
          <div className="as-card-name">${plugin.name || plugin.id}</div>
          <div className="as-card-id">${plugin.id} · v${plugin.version}</div>
        </div>
        <${ToggleSwitch}
          checked=${plugin.enabled}
          disabled=${plugin.required}
          onChange=${() => onToggle(plugin)}
          label=${plugin.enabled ? `Disable ${plugin.name}` : `Enable ${plugin.name}`}
        />
      </div>
      ${plugin.description ? html`<div className="as-card-desc">${plugin.description}</div>` : null}
      <${Badges} plugin=${plugin}/>
      <${PermissionSummary} plugin=${plugin} onChipClick=${(e) => onChipClick && onChipClick(e, plugin)}/>
      ${plugin.loadError ? html`<div className="as-card-desc" style=${{ color: "#f85149" }}>${plugin.loadError}</div>` : null}
      <div className="as-card-actions">
        <button
          type="button"
          className="as-btn primary"
          disabled=${!plugin.enabled}
          title=${plugin.enabled ? `Open ${plugin.name} in a new tab` : `Enable ${plugin.name} first`}
          onClick=${() => onOpen(plugin)}
        ><${ExternalLink} size=${12} aria-hidden=${true}/> Open</button>
        <button
          type="button"
          className="as-btn"
          title="View permissions and details"
          onClick=${() => onShowDetail(plugin)}
        ><${ShieldCheck} size=${12} aria-hidden=${true}/> Permissions${perms.length ? html` (${perms.length})` : null}</button>
        <button
          type="button"
          className="as-btn"
          disabled=${plugin.required}
          onClick=${() => onEdit(plugin)}
        ><${Pencil} size=${12} aria-hidden=${true}/> Edit</button>
        <button
          type="button"
          className="as-btn danger"
          disabled=${plugin.builtin}
          onClick=${() => onRemove(plugin)}
        ><${Trash2} size=${12} aria-hidden=${true}/> Remove</button>
      </div>
    </div>
  </article>`;
}

function PluginRowList({ plugin, expanded, onToggleExpand, onToggle, onEdit, onRemove, onOpen, onChipClick }) {
  const Icon = iconOf(plugin.icon);
  const perms = plugin.permissions?.api || [];
  return html`<div className=${"as-row-wrap " + (plugin.enabled ? "" : "is-disabled") + (plugin.required ? "is-required " : "")}>
    <div className=${"as-row " + (expanded ? "is-expanded " : "")}>
      <button
        type="button"
        className="as-row-chevron"
        aria-expanded=${expanded ? "true" : "false"}
        aria-label=${expanded ? `Collapse ${plugin.name} permissions` : `Expand ${plugin.name} permissions`}
        title=${expanded ? "Collapse" : "Show permissions"}
        onClick=${() => onToggleExpand(plugin.id)}
      ><${expanded ? ChevronDown : ChevronRight} size=${14} aria-hidden=${true}/></button>
      <div className="as-row-icon"><${Icon} size=${16} aria-hidden=${true}/></div>
      <div className="as-row-name-cell">
        <div className="as-row-name">${plugin.name || plugin.id}</div>
        <div className="as-row-id">${plugin.id} · v${plugin.version}</div>
      </div>
      <div className="as-row-tags">
        ${(plugin.tags || []).slice(0, 6).map((t) => html`<span key=${t} className="as-badge">${t}</span>`)}
      </div>
      <div className="as-row-perms">
        <${PermissionSummary} plugin=${plugin} onChipClick=${(e) => { e?.stopPropagation?.(); onChipClick && onChipClick(e, plugin); }}/>
      </div>
      <div className="as-row-actions">
        <${ToggleSwitch}
          checked=${plugin.enabled}
          disabled=${plugin.required}
          onChange=${() => onToggle(plugin)}
          label=${plugin.enabled ? `Disable ${plugin.name}` : `Enable ${plugin.name}`}
        />
        <button
          type="button"
          className="as-btn primary"
          disabled=${!plugin.enabled}
          title=${plugin.enabled ? `Open ${plugin.name} in a new tab` : `Enable ${plugin.name} first`}
          onClick=${() => onOpen(plugin)}
        ><${ExternalLink} size=${12} aria-hidden=${true}/></button>
        <button type="button" className="as-btn" disabled=${plugin.required} onClick=${() => onEdit(plugin)}><${Pencil} size=${12} aria-hidden=${true}/></button>
        <button type="button" className="as-btn danger" disabled=${plugin.builtin} onClick=${() => onRemove(plugin)}><${Trash2} size=${12} aria-hidden=${true}/></button>
      </div>
    </div>
    ${expanded
      ? html`<div className="as-row-expand">
          <${PermissionPanel} plugin=${plugin}/>
        </div>`
      : null}
  </div>`;
}

function PluginModal({ mode, plugin, onCancel, onSubmit }) {
  const initial = plugin || {
    id: "",
    name: "",
    version: "1.0.0",
    icon: "Wrench",
    tags: [],
    iframe: { src: "" },
    entry: "",
    permissions: { api: [] },
  };
  const [kind, setKind] = useState(
    plugin ? (plugin.iframe ? "iframe" : plugin.entry ? "component" : "iframe") : "iframe",
  );
  const [values, setValues] = useState({
    id: initial.id,
    name: initial.name,
    version: initial.version,
    icon: initial.icon,
    tags: (initial.tags || []).join(", "),
    src: initial.iframe?.src || "",
    allow: initial.iframe?.allow || "",
    allowFullscreen: initial.iframe?.allowFullscreen === true,
    entry: initial.entry || "",
    permissions: (initial.permissions?.api || []).join("\n"),
  });
  const update = (key) => (event) => {
    const value = event?.target?.type === "checkbox"
      ? event.target.checked
      : event.target.value;
    setValues((prev) => ({ ...prev, [key]: value }));
  };
  return html`<div className="as-modal-back" onClick=${onCancel}>
    <div className="as-modal" onClick=${(e) => e.stopPropagation()}>
      <h2>${mode === "edit" ? "Edit plugin" : "Install plugin"}</h2>
      <div className="as-modal-tabs">
        <button type="button" className=${kind === "iframe" ? "active" : ""} onClick=${() => setKind("iframe")}>iframe</button>
        <button type="button" className=${kind === "component" ? "active" : ""} onClick=${() => setKind("component")}>component</button>
      </div>
      <label>Id<input value=${values.id} onInput=${update("id")} placeholder="my-plugin"/></label>
      <label>Name<input value=${values.name} onInput=${update("name")} placeholder="My Plugin"/></label>
      <label>Version<input value=${values.version} onInput=${update("version")}/></label>
      <label>Icon (lucide-react)<input value=${values.icon} onInput=${update("icon")} placeholder="Wrench"/></label>
      <label>Tags (comma-separated)<input value=${values.tags} onInput=${update("tags")} placeholder="terminal, agent, media"/></label>
      ${kind === "iframe"
        ? html`<label>Iframe src<input value=${values.src} onInput=${update("src")} placeholder="/path/to/index.html or https://..."/></label>
           <label>allow (Permissions Policy)<input value=${values.allow} onInput=${update("allow")} placeholder="clipboard-read; clipboard-write; fullscreen"/></label>
           <label><input type="checkbox" checked=${values.allowFullscreen} onChange=${update("allowFullscreen")}/> allowFullscreen</label>`
        : html`<label>Entry URL<input value=${values.entry} onInput=${update("entry")} placeholder="/plugin/my/plugin.js"/></label>`}
      <label>Permissions (one API name per line)<textarea onInput=${update("permissions")} placeholder=${"panels.list\nevents.on"}>${values.permissions}</textarea></label>
      <div className="as-modal-actions">
        <button type="button" className="as-btn" onClick=${onCancel}>Cancel</button>
        <button type="button" className="as-btn primary" onClick=${() => onSubmit(values, kind)}>${mode === "edit" ? "Save" : "Install"}</button>
      </div>
    </div>
  </div>`;
}

function App() {
  const store = useStore();
  const { onToggle, onRemove, onOpen, onSubmit } = useActions(store);
  const editing = store.modal?.mode === "edit" ? store.modal.plugin : null;
  // Clicking a permission chip in a card/row sets the search filter to
  // "perm:<path>" — the same syntax the user can type manually. The
  // filter is a single source of truth, so the visible set updates and
  // the tag chips stay consistent without any extra state.
  const onChipClick = (_event, plugin) => {
    const first = plugin?.permissions?.api?.[0];
    store.setQuery(first ? `perm:${first}` : "perm:");
  };
  return html`<div className="as-bar">
    <h1><${Store} size=${16} aria-hidden=${true}/> App Store</h1>
    <label className="as-search">
      <${Search} size=${14} aria-hidden=${true}/>
      <input
        type="search"
        placeholder="Search by name, id or use perm:<api-path> to filter by permission"
        value=${store.query}
        onInput=${(e) => store.setQuery(e.target.value)}
      />
    </label>
    <span className="as-count">${store.visible.length} / ${store.plugins.length}</span>
    <div className="as-view" role="group" aria-label="View mode">
      <button
        type="button"
        className=${store.view === "grid" ? "active" : ""}
        title="Card view"
        onClick=${() => store.setView("grid")}
      ><${LayoutGrid} size=${14} aria-hidden=${true}/></button>
      <button
        type="button"
        className=${store.view === "list" ? "active" : ""}
        title="List view"
        onClick=${() => store.setView("list")}
      ><${List} size=${14} aria-hidden=${true}/></button>
    </div>
    <button
      type="button"
      className="as-add"
      onClick=${() => store.setModal({ mode: "add" })}
    ><${Plus} size=${14} aria-hidden=${true}/> Install</button>
  </div>
  <${TagChips} allTags=${store.allTags} activeTags=${store.activeTags} onToggle=${store.toggleTag}/>
  ${store.query.startsWith("perm:") ? html`<div className="as-perm-banner">
    <${KeyRound} size=${12} aria-hidden=${true}/>
    <span>Filtering by permission: <code>${store.query}</code></span>
    <button type="button" className="as-perm-banner-clear" onClick=${() => store.setQuery("")}>Clear</button>
  </div>` : null}
  <div className="as-scroll">
    ${store.plugins.length === 0
      ? html`<div className="as-empty">
          <${Store} size=${32} aria-hidden=${true}/>
          <p>${typeof GearShell === "undefined"
              ? "The App Store needs the gear bridge."
              : "No plugins installed."}</p>
          <p className="as-empty-hint">${typeof GearShell === "undefined"
              ? "Open this plugin from the dockview grid — the bridge installs window.GearShell on this iframe."
              : html`Click <strong>Install</strong> to add your first plugin.`}</p>
        </div>`
      : store.visible.length === 0
        ? html`<div className="as-empty">
            <${Search} size=${28} aria-hidden=${true}/>
            <p>No plugins match the current filters.</p>
            <p className="as-empty-hint">Try clearing tags or the permission filter.</p>
          </div>`
        : store.view === "grid"
          ? html`<div className="as-grid">
              ${store.visible.map((plugin) => html`<${PluginCardGrid}
                key=${plugin.id}
                plugin=${plugin}
                onToggle=${onToggle}
                onEdit=${(p) => store.setModal({ mode: "edit", plugin: p })}
                onRemove=${onRemove}
                onOpen=${onOpen}
                onShowDetail=${store.openDetail}
                onChipClick=${onChipClick}
              />`)}
            </div>`
          : html`<div className="as-list">
              ${store.visible.map((plugin) => html`<${PluginRowList}
                key=${plugin.id}
                plugin=${plugin}
                expanded=${store.expandedRows.has(plugin.id)}
                onToggleExpand=${store.toggleExpandedRow}
                onToggle=${onToggle}
                onEdit=${(p) => store.setModal({ mode: "edit", plugin: p })}
                onRemove=${onRemove}
                onOpen=${onOpen}
                onChipClick=${onChipClick}
              />`)}
            </div>`}
  </div>
  <${NoticeBar} notice=${store.notice}/>
  ${store.modal ? html`<${PluginModal}
    mode=${store.modal.mode}
    plugin=${editing}
    onCancel=${() => store.setModal(null)}
    onSubmit=${onSubmit}
  />` : null}
  ${store.detailPlugin ? html`<${PluginDetailModal}
    plugin=${store.detailPlugin}
    onClose=${store.closeDetail}
    onOpen=${onOpen}
  />` : null}
  `;
}

createRoot(document.getElementById("app")).render(html`<${App}/>`);
console.log("[app-store] mounted");
</script>
</body>
</html>
