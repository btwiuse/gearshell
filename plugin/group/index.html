<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; background: #0d1117; }
    .group-panel {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      min-height: 0;
    }
    .group-panel img {
      display: block;
      /* Fit the smaller dimension to its container: the browser
         scales the image down so that width ≤ container width and
         height ≤ container height while preserving the aspect
         ratio, then centres. `min-width: 0` / `min-height: 0` let
         the percentage max-* resolve against the flex item's
         content box instead of the intrinsic size — without them
         a tall image overflows a short panel because the browser
         preserves its natural ratio. */
      max-width: 100%;
      max-height: 100%;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="group-panel">
    <img src="./group.png" alt="Gear Shell group">
  </main>
</body>
</html>
