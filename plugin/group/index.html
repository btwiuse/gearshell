<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; background: #0d1117; }
    .group-panel { height: 100%; display: grid; place-items: center; padding: 16px; }
    .group-panel img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <main class="group-panel">
    <img src="./group.png" alt="Gear Shell group">
  </main>
</body>
</html>
