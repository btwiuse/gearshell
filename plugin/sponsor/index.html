<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sponsor GearShell</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: auto; background: radial-gradient(circle at 18% 12%, #1b3550, #0d1117 48%, #080b10); color: #f0f6fc; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .sponsor { width: min(720px, 100%); margin: 0 auto; padding: 30px 20px 40px; text-align: center; }
  .sponsor h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.03em; }
  .sponsor p.lede { margin: 0 0 26px; color: #9da9b8; line-height: 1.55; }
  .qr-frame { display: inline-block; padding: 14px; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.08); }
  .qr-frame img { display: block; width: clamp(220px, 46vw, 280px); height: auto; border-radius: 8px; image-rendering: pixelated; }
  .qr-caption { margin: 12px 0 26px; color: #aeb8c5; font-size: 13px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .actions a, .actions button { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 9px 16px; border: 1px solid rgba(143,209,255,.3); border-radius: 999px; color: #e6f5ff; background: rgba(143,209,255,.1); font: inherit; text-decoration: none; cursor: pointer; }
  .actions a:hover, .actions button:hover { background: rgba(143,209,255,.2); }
  .actions .primary { border-color: #FFDD00; background: #FFDD00; color: #1a1a1a; font-weight: 600; }
  .actions .primary:hover { background: #ffe933; }
  .icon { width: 16px; height: 16px; object-fit: contain; }
  .toast { margin-top: 18px; color: #87d39a; min-height: 18px; font-size: 13px; }
  footer { margin-top: 36px; color: #6e7886; font-size: 12px; }
  footer a { color: #aeb8c5; text-decoration: underline; }
  @media (max-width: 480px) { .actions { flex-direction: column; } .actions a, .actions button { width: 100%; } }
</style>
</head>
<body>
<main class="sponsor">
  <h1>Sponsor GearShell</h1>
  <p class="lede">If GearShell saved you a CPU cycle, bought back your weekend, or helped you ship something weird — fuel the next release.</p>

  <div class="qr-frame" aria-label="Buy Me a Coffee QR code">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=560x560&margin=2&bgcolor=ffffff&color=000000&data=https%3A%2F%2Fbuymeacoffee.com%2Fjustwasm&format=svg"
         alt="QR code linking to https://buymeacoffee.com/justwasm" />
  </div>
  <div class="qr-caption">Scan to open <strong>buymeacoffee.com/justwasm</strong></div>

  <div class="actions">
    <a class="primary" href="https://buymeacoffee.com/justwasm" target="_blank" rel="noopener noreferrer">
      <img class="icon" src="https://cdn.simpleicons.org/buymeacoffee/000000" alt="">
      Buy me a coffee
    </a>
    <button id="copy-btn" type="button" aria-label="Copy link">
      <img class="icon" src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.46.0/icons/outline/link.svg" alt="">
      <span id="copy-label">Copy link</span>
    </button>
    <a href="https://github.com/btwiuse/gearshell" target="_blank" rel="noopener noreferrer">
      <img class="icon" src="https://cdn.simpleicons.org/github/ffffff" alt="">
      Star on GitHub
    </a>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer>
    100% of tips go to compute + maintainer hours. <a href="https://github.com/sponsors/btwiuse" target="_blank" rel="noopener noreferrer">GitHub Sponsors</a> also works.
  </footer>
</main>
<script>
  const SPONSOR_URL = "https://buymeacoffee.com/justwasm";
  const toast = document.getElementById("toast");
  const copyBtn = document.getElementById("copy-btn");
  const copyLabel = document.getElementById("copy-label");
  let toastHandle = 0;
  function showToast(text) {
    toast.textContent = text;
    clearTimeout(toastHandle);
    toastHandle = setTimeout(() => { toast.textContent = ""; }, 2400);
  }
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(SPONSOR_URL);
      copyLabel.textContent = "Copied";
      showToast("Link copied to clipboard");
      setTimeout(() => { copyLabel.textContent = "Copy link"; }, 1600);
    } catch {
      // Fallback for browsers without clipboard permission (e.g. unsecure
      // iframe context): just show the URL inline so the user can copy
      // from the toast itself.
      showToast(SPONSOR_URL);
    }
  });
</script>
</body>
</html>
