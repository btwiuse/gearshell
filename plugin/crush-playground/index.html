<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crush Playground</title>
<link rel="stylesheet" href="/plugin/crush-playground/crush-playground.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.1.0-beta.304/css/xterm.css" />
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="hero-title">
      <img class="hero-logo" src="/plugin/crush-playground/assets/crush-icon.png" alt="" />
      <h1>Crush Playground</h1>
    </div>
    <div class="hero-actions">
      <div class="status" id="status" role="status" aria-live="polite">Loading Crush status…</div>
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle presets panel" aria-expanded="false" aria-controls="sidebar">☰</button>
    </div>
  </header>
  <main class="layout">
    <aside class="sidebar" id="sidebar" data-state="strip">
      <div class="sidebar-head"><h2>Presets</h2></div>
      <div id="preset-list"></div>
      <div class="sidebar-strip" id="sidebar-strip"></div>
      <div class="sidebar-rail-actions">
        <button class="new-preset-rail" id="new-preset-rail" type="button" aria-label="New preset" title="New preset">+</button>
        <button id="sidebar-rail-toggle" class="sidebar-rail-toggle" type="button" aria-label="Expand presets" title="Expand">»</button>
      </div>
      <div class="sidebar-resize" id="sidebar-resize" aria-label="Resize sidebar"></div>
    </aside>
    <section class="content">
      <div id="install-banner" class="banner" hidden></div>
      <section class="terminal-frame" id="terminal-frame">
        <div class="terminal-bar">
          <span class="terminal-dot terminal-dot-red"></span><span class="terminal-dot terminal-dot-yellow"></span><span class="terminal-dot terminal-dot-green"></span>
          <span class="terminal-title">crush@gear: /opfs/home</span>
          <span class="terminal-actions" id="terminal-actions" hidden><span class="terminal-status"><span class="terminal-status-dot"></span>session live</span><button id="close-terminal" class="terminal-button" type="button">×</button><button id="restart-terminal" class="terminal-button" type="button">↻</button><button id="fullscreen-terminal" class="terminal-button" type="button">⛶</button></span>
        </div>
        <button id="terminal-placeholder" class="terminal-placeholder" type="button" aria-label="Open Crush terminal"><pre><span class="prompt">$ crush</span>
<span class="muted">Crush Runner is ready.</span>
<span class="muted">Click to start a live Crush session.</span>
<span class="prompt">$ ▌</span></pre></button>
        <div id="terminal" class="terminal" hidden></div>
      </section>
    </section>
  </main>
</div>
<script src="/plugin/gear-bridge.js"></script>
<script type="module">
import { ghosttyIdentity, iframeSession, mountTerminal } from "/plugin/terminal-mount.mjs";

const CRUSH_STATE_KEY = "crush-playground:state";
const CRUSH_BUILTINS_KEY = "crush-playground:builtins";
const CRUSH_DEFAULT_ACTIVE_ID = "crush";

// Build the page snapshot from the two generic-kv keys the host
// owns: a read-only `crush-playground:builtins` seeded once per
// workspace, and `crush-playground:state` (customs + activeId +
// order) the user mutates through this UI.
async function loadSnapshot() {
  const [state, builtins] = await Promise.all([
    GearShell.config.kv.get(CRUSH_STATE_KEY),
    GearShell.config.kv.get(CRUSH_BUILTINS_KEY),
  ]);
  const builtinsList = Array.isArray(builtins) ? builtins : [];
  const customs = state && Array.isArray(state.customs) ? state.customs : [];
  const all = [...builtinsList, ...customs];
  const order = state && Array.isArray(state.order) && state.order.length > 0
    ? state.order
    : all.map((preset) => preset.id);
  const positions = new Map(order.map((id, index) => [id, index]));
  return {
    presets: [...all].sort((left, right) =>
      (positions.get(left.id) ?? 0) - (positions.get(right.id) ?? 0)
    ),
    activeId: state && typeof state.activeId === "string"
      ? state.activeId
      : CRUSH_DEFAULT_ACTIVE_ID,
    order,
  };
}

// Patch `crush-playground:state` and return the refreshed page
// snapshot. The iframe merges on top of whatever's already in KV,
// so callers can change just the keys they care about (e.g. only
// `activeId`).
async function writeState(patch, agent = "crush-playground") {
  const current = (await GearShell.config.kv.get(CRUSH_STATE_KEY)) || {};
  const next = { ...current, ...patch };
  await GearShell.config.kv.set(CRUSH_STATE_KEY, next, { agent });
  return loadSnapshot();
}

const state = { snapshot: null, selected: null, terminal: null, terminals: new Map(), notified: new Set(), sidebarOpen: false, sidebarWidth: 240, taskTopic: false, fullscreen: false };
const elements = Object.fromEntries(["status", "install-banner", "preset-list", "terminal-frame", "terminal-actions", "terminal-placeholder", "terminal", "close-terminal", "restart-terminal", "fullscreen-terminal", "new-preset-rail", "sidebar", "sidebar-strip", "sidebar-toggle", "sidebar-rail-toggle", "sidebar-resize"].map((id) => [id, document.getElementById(id)]));

function setStatus(message, error = false) {
  elements.status.textContent = message;
  elements.status.dataset.error = error ? "true" : "false";
}

function showBanner(message, action = null) {
  elements["install-banner"].hidden = !message;
  elements["install-banner"].textContent = "";
  if (!message) return;
  elements["install-banner"].append(message);
  if (action) elements["install-banner"].append(" ", action);
}

function activePreset() {
  return state.snapshot?.presets.find((preset) => preset.id === state.snapshot.activeId) || state.snapshot?.presets[0] || null;
}

function presetFields(preset) {
  return `
    <label>Name<input data-field="name" value="${escapeHtml(preset.name || "")}" /></label>
    <label>Program<input data-field="program" value="${escapeHtml(preset.program || "")}" /></label>
    <label>Arguments<input data-field="args" value="${escapeHtml(preset.args || "")}" /></label>
    <label>Runtime<select data-field="type"><option value="auto">Auto</option><option value="gojs">Go + JavaScript</option><option value="wasi">WASI</option><option value="js">JavaScript</option></select></label>
    <label>Working directory<input data-field="wd" value="${escapeHtml(preset.wd || "")}" /></label>
    <label>Icon<input data-field="icon" value="${escapeHtml(preset.icon || "bot")}" /></label>
    <label>Environment<textarea data-field="env" rows="3">${escapeHtml(preset.env || "")}</textarea></label>
    <label>crushrc<textarea data-field="crushrc" rows="8">${escapeHtml(preset.crushrc || "")}</textarea></label>
  `;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>\"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '\"': "&quot;", "'": "&#39;" }[char]));
}

function readCard(card) {
  const preset = { id: card.dataset.id };
  for (const field of card.querySelectorAll("[data-field]")) preset[field.dataset.field] = field.value;
  return preset;
}

const PRESET_ICON_PATHS = {
  bot: "<rect x=\"4\" y=\"6\" width=\"16\" height=\"13\" rx=\"3\"/><path d=\"M12 2v4M8 12h.01M16 12h.01M8 16h8\"/>",
  ghost: "<path d=\"M5 20V10a7 7 0 0 1 14 0v10l-3-2-4 2-4-2-3 2Z\"/><path d=\"M9 11h.01M15 11h.01\"/>",
  fish: "<path d=\"M20 12s-3-5-9-5c-3 0-5 2-7 5 2 3 4 5 7 5 6 0 9-5 9-5Z\"/><path d=\"M4 12H2M16 10h.01M16 14h.01\"/>",
  footprints: "<path d=\"M8 20c-2 0-3-1-3-3 0-2 1-4 3-4s3 2 3 4c0 2-1 3-3 3ZM16 12c-2 0-3-1-3-3 0-2 1-4 3-4s3 2 3 4c0 2-1 3-3 3Z\"/><path d=\"M6 10c-1-1-1-3 0-4s3-1 4 1M14 17c-1-1-1-3 0-4s3-1 4 1\"/>",
};

function presetIconSvg(icon) {
  const path = PRESET_ICON_PATHS[icon] || PRESET_ICON_PATHS.bot;
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
}

function setCardSelected(id) {
  for (const card of elements["preset-list"].querySelectorAll(".preset-card")) {
    card.classList.toggle("selected", card.dataset.id === id);
  }
}

function setPresetDot(presetId, on) {
  const card = elements["preset-list"].querySelector(`.preset-card[data-id="${presetId}"]`);
  const dot = card && card.querySelector(".preset-dot");
  if (dot) dot.hidden = !on;
  // Mirror onto the strip rail button (the icon column shows the
  // same notification dot as the expanded card).
  const icon = elements["sidebar-strip"] && elements["sidebar-strip"].querySelector(`.sidebar-rail-icon[data-id="${presetId}"]`);
  if (icon) {
    let railDot = icon.querySelector(".rail-dot");
    if (on && !railDot) {
      railDot = document.createElement("span");
      railDot.className = "rail-dot";
      icon.append(railDot);
    } else if (!on && railDot) {
      railDot.remove();
    }
  }
}

function setPresetLive(presetId, on) {
  const head = elements["preset-list"].querySelector(
    `.preset-card[data-id="${presetId}"] .preset-head`
  );
  if (head) head.classList.toggle("preset-live", on);
  const icon = elements["sidebar-strip"] && elements["sidebar-strip"].querySelector(`.sidebar-rail-icon[data-id="${presetId}"]`);
  if (icon) icon.classList.toggle("selected", on);
}

function markPresetChime(presetId) {
  // If the user is already looking at this preset's terminal, the
  // chime itself is the signal — no need to mark the card.
  if (state.terminal?.preset.id === presetId) return;
  state.notified.add(presetId);
  setPresetDot(presetId, true);
}

function clearPresetChime(presetId) {
  state.notified.delete(presetId);
  setPresetDot(presetId, false);
}

async function selectPreset(preset, editor) {
  const changed = state.snapshot.activeId !== preset.id;
  state.selected = preset;
  state.snapshot.activeId = preset.id;
  setCardSelected(preset.id);
  for (const other of elements["preset-list"].querySelectorAll(".preset-editor")) {
    if (other !== editor) other.hidden = true;
  }
  if (changed) {
    editor.hidden = true;
    await writeState({ activeId: preset.id });
    // Switching presets only swaps the visible terminal (cached if
    // present, placeholder otherwise) — it does NOT start a new
    // session. The user clicks the placeholder (or a cached host's
    // own restart button) to actually launch Crush.
    switchPresetView(preset);
    return;
  }
  editor.hidden = !editor.hidden;
  editor.closest(".preset-card").querySelector(".preset-toggle")
    .setAttribute("aria-expanded", String(!editor.hidden));
}

// Show a preset's view: re-attach its cached terminal if any, or
// show the placeholder. Does not create a new session — call
// launch() for that.
function switchPresetView(preset) {
  if (!preset) return;
  clearPresetChime(preset.id);
  if (state.terminal && state.terminal.preset.id !== preset.id) {
    state.terminal.host.hidden = true;
  }
  const cached = state.terminals.get(preset.id);
  if (cached) {
    if (!cached.host.parentNode) elements.terminal.append(cached.host);
    cached.host.hidden = false;
    state.terminal = cached;
    requestAnimationFrame(() => {
      try { cached.handle.fitTerminal?.(); } catch {}
      try { cached.handle.term.focus(); } catch {}
    });
    elements["terminal-placeholder"].hidden = true;
    elements.terminal.hidden = false;
    elements["terminal-actions"].hidden = false;
    setStatus(`Running ${preset.name}`);
  } else {
    // No session yet for this preset — show the placeholder and let
    // the user start one with a click.
    state.terminal = null;
    for (const host of Array.from(elements.terminal.querySelectorAll(".terminal-instance"))) {
      host.hidden = true;
    }
    elements.terminal.hidden = true;
    elements["terminal-placeholder"].hidden = false;
    elements["terminal-actions"].hidden = true;
    setStatus("Idle");
  }
}

function renderPresets() {
  elements["preset-list"].textContent = "";
  for (const preset of state.snapshot?.presets || []) {
    const card = document.createElement("article");
    card.className = "preset-card" + (preset.id === state.snapshot.activeId ? " selected" : "");
    card.dataset.id = preset.id;
        card.innerHTML = `<div class="preset-head${state.terminals.has(preset.id) ? " preset-live" : ""}"><button class="preset-toggle" type="button" aria-expanded="false"><span class="preset-icon">${presetIconSvg(preset.icon)}</span><span>${escapeHtml(preset.name)}</span></button><span class="preset-dot"${state.notified.has(preset.id) ? "" : " hidden"}></span></div><div class="preset-editor" hidden><form class="preset-form">${presetFields(preset)}<div class="preset-actions"><button class="save-preset" type="submit">Save</button><button class="remove-preset danger" type="button" ${preset.builtin ? "disabled" : ""}>Remove</button></div></form></div>`;
    card.querySelector('[data-field="type"]').value = preset.type || "gojs";
    const editor = card.querySelector(".preset-editor");
    card.querySelector(".preset-toggle").addEventListener("click", () => {
      selectPreset(preset, editor).catch(showError);
    });
    card.querySelector(".preset-form").addEventListener("submit", (event) => saveCard(event, card));
    card.querySelector(".remove-preset").addEventListener("click", () => removeCard(card));
    elements["preset-list"].append(card);
  }
  renderStrip();
}

function renderStrip() {
  const strip = elements["sidebar-strip"];
  if (!strip) return;
  strip.textContent = "";
  for (const preset of state.snapshot?.presets || []) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "sidebar-rail-icon" + (preset.id === state.snapshot.activeId ? " selected" : "");
    btn.title = preset.name;
    btn.setAttribute("aria-label", preset.name);
    btn.dataset.id = preset.id;
    btn.innerHTML = presetIconSvg(preset.icon) + (state.notified.has(preset.id) ? '<span class="rail-dot"></span>' : "");
    btn.addEventListener("click", () => {
      // Clicking an icon from the strip expands the sidebar and
      // switches to that preset — the strip never edits in place.
      if (!state.sidebarOpen) {
        state.sidebarOpen = true;
        applySidebarState();
      }
      selectPreset(preset).catch(showError);
    });
    strip.append(btn);
  }
}

function writeForm(preset) {
  state.selected = preset;
}

async function refresh() {
  state.snapshot = await loadSnapshot();
  const selected = state.snapshot.presets.find((preset) => preset.id === state.selected?.id) || activePreset();
  writeForm(selected);
  renderPresets();
}

function showError(error) {
  setStatus(error?.message || String(error), true);
}

async function waitForTask(spec) {
  if (!state.taskTopic) {
    await GearShell.subscribe("task.status");
    state.taskTopic = true;
  }
  return new Promise((resolve, reject) => {
    let taskId = null;
    const onStatus = async (detail) => {
      if (taskId == null || Number(detail?.taskId) !== Number(taskId)) return;
      if (!["succeeded", "failed", "cancelled"].includes(detail.status)) return;
      GearShell.off("task.status", onStatus);
      try {
        const output = await GearShell.tasks.output(taskId);
        if (detail.status !== "succeeded") reject(new Error(output?.output?.trim() || `Task ${detail.status}`));
        else resolve(output?.output || "");
      } catch (error) {
        reject(error);
      }
    };
    GearShell.on("task.status", onStatus);
    GearShell.tasks.create(spec, { background: true }).then((started) => {
      if (!started?.ok || started.taskId == null) {
        GearShell.off("task.status", onStatus);
        reject(new Error(started?.error || "Could not start task"));
        return;
      }
      taskId = started.taskId;
    }).catch((error) => {
      GearShell.off("task.status", onStatus);
      reject(error);
    });
  });
}

async function detect() {
  try {
    const status = await GearShell.w9y.status("crush");
    if (status?.installed) {
      setStatus(status.installed);
      showBanner("");
      return;
    }
    setStatus("Crush is not installed");
    const install = document.createElement("button");
    install.type = "button";
    install.textContent = "Install Crush";
    install.addEventListener("click", installCrush);
    showBanner("Crush is not installed.", install);
  } catch (error) {
    setStatus(error.message, true);
  }
}

async function installCrush() {
  showBanner("Installing Crush…");
  setStatus("Running w9y mod apply crush…");
  try {
    await waitForTask({ name: "Install Crush", cmd: "w9y mod apply crush", term: false });
    showBanner("");
    setStatus("Crush installed. You can launch it now.");
    await refresh();
  } catch (error) {
    showBanner(error.message);
    setStatus("Crush installation failed", true);
  }
}

async function saveCard(event, card) {
  event.preventDefault();
  try {
    const preset = readCard(card);
    const current = state.snapshot || await loadSnapshot();
    const customs = current.presets
      .filter((p) => p.builtin !== true)
      .filter((p) => p.id !== preset.id);
    customs.push({ ...preset, builtin: false });
    state.snapshot = await writeState({ customs, activeId: preset.id });
    state.selected = preset;
    renderPresets();
    setStatus("Preset saved");
  } catch (error) {
    showError(error);
  }
}

async function removeCard(card) {
  try {
    const id = card.dataset.id;
    const current = state.snapshot || await loadSnapshot();
    const customs = current.presets
      .filter((p) => p.builtin === true || p.id !== id);
    const nextActiveId = current.activeId === id ? undefined : current.activeId;
    state.snapshot = await writeState({ customs, activeId: nextActiveId });
    await refresh();
    setStatus("Preset removed");
  } catch (error) {
    showError(error);
  }
}

function profileFor(preset) {
  const env = preset.env || "";
  const configEnv = "CRUSH_GLOBAL_CONFIG=/preset";
  const program = !preset.program || preset.program === "crush"
    ? "/opfs/wanix/crush"
    : preset.program;
  const args = preset.args || "";
  return {
    name: preset.name || "Crush",
    program,
    args,
    type: preset.type || "gojs",
    wd: preset.wd || "/opfs/home",
    env: [env.trim(), configEnv].filter(Boolean).join("\n"),
    extraBinds: [
      { type: "ns", dst: "preset", src: "#ramfs/new" },
      { type: "file", dst: "preset/crushrc", content: preset.crushrc || "" },
    ],
  };
}

async function switchTerminal(preset) {
  if (!preset) return;
  await launch(preset);
}

// Each terminal instance owns its own progress bar DOM. The bar is
// closed over by the setupAddons callback below so updateProgress
// reaches it without any DOM lookup — and only that bar, regardless
// of which preset is currently mounted.
function renderProgress(progress, bar, fill) {
  const stateValue = progress && progress.state;
  const value = Math.max(0, Math.min(100, Number(progress && progress.value) || 0));
  bar.hidden = stateValue === 0 || stateValue == null;
  bar.dataset.state = String(stateValue == null ? 0 : stateValue);
  fill.style.width = value + "%";
  if (stateValue === 3) {
    bar.removeAttribute("aria-valuenow");
  } else {
    bar.setAttribute("aria-valuenow", String(value));
  }
}

async function launch(preset = activePreset()) {
  preset = preset || activePreset();
  if (!preset) return;
  // Switching to this preset — clear any pending "agent finished" dot
  // for it. The chime itself is the notification for the case where
  // the preset is already active (handled inside markPresetChime).
  clearPresetChime(preset.id);
  // Already showing this preset — just focus it.
  if (state.terminal?.preset.id === preset.id) {
    requestAnimationFrame(() => state.terminal.handle.term.focus());
    return;
  }
  // Hide the current terminal host before showing anything else, so
  // #terminal never holds two visible .terminal-instance siblings
  // (which its default flex-direction:row would lay out side by
  // side). The cached handle stays alive with its session + xterm +
  // scrollback; we only detach it from the flex layout.
  if (state.terminal) {
    state.terminal.host.hidden = true;
  }
  // A cached session for this preset still exists — switch back to it
  // without tearing the kernel session down.
  const cached = state.terminals.get(preset.id);
  if (cached) {
    elements["terminal-placeholder"].hidden = true;
    elements.terminal.hidden = false;
    elements["terminal-actions"].hidden = false;
    // If the host was detached (e.g. by closeTerminal) re-append it.
    if (!cached.host.parentNode) elements.terminal.append(cached.host);
    cached.host.hidden = false;
    state.terminal = cached;
    // Defer focus + fit until after layout flushes, otherwise
    // xterm.focus() on a host that just went from display:none to
    // flex has no measurable size yet and the textarea grab misses.
    requestAnimationFrame(() => {
      try { cached.handle.fitTerminal?.(); } catch {}
      try { cached.handle.term.focus(); } catch {}
    });
    setStatus(`Running ${preset.name}`);
    return;
  }
  // Nothing cached — mount a fresh terminal for this preset.
  elements["terminal-placeholder"].hidden = true;
  elements.terminal.hidden = false;
  elements["terminal-actions"].hidden = false;
  const session = iframeSession(GearShell);
  session.create = () => GearShell.terminal.create(profileFor(preset));
  try {
    const host = document.createElement("div");
    host.className = "terminal-instance";
    host.hidden = false;
    const progressBar = document.createElement("div");
    progressBar.className = "term-progress";
    progressBar.hidden = true;
    const progressFill = document.createElement("div");
    progressFill.className = "term-progress-fill";
    progressBar.append(progressFill);
    host.append(progressBar);
    elements.terminal.append(host);
    const handle = await mountTerminal(host, session, {
      ...ghosttyIdentity({ terminal: { fontSize: 13, scrollback: 12000, scrollbar: { showScrollbar: false }, theme: { background: "#0a0e14", foreground: "#e6edf3", cursor: "#58a6ff" } } }),
      setupAddons: (term, libs) => {
        const addon = new libs.ProgressAddon();
        term.loadAddon(addon);
        addon.onChange((progress) => renderProgress(progress, progressBar, progressFill));
      },
      onProgressDone: () => markPresetChime(preset.id),
      onExit: (payload) => setStatus(payload.error ? payload.error : `Crush exited (${payload.code ?? "?"})`),
    });
    const entry = { host, handle, preset };
    state.terminals.set(preset.id, entry);
    state.terminal = entry;
    setPresetLive(preset.id, true);
    requestAnimationFrame(() => handle.term.focus());
    setStatus(`Running ${preset.name}`);
  } catch (error) {
    elements["terminal-placeholder"].hidden = false;
    elements["terminal-actions"].hidden = true;
    showError(error);
  }
}

async function closeTerminal() {
  // Click on the X: stop the current session and surface the
  // placeholder. The user can re-open the same preset (or a different
  // one) by clicking the placeholder or another preset card.
  if (!state.terminal) return;
  const presetId = state.terminal.preset.id;
  try {
    state.terminal.handle.dispose();
  } catch {}
  state.terminals.delete(presetId);
  setPresetLive(presetId, false);
  const oldHost = state.terminal.host;
  state.terminal = null;
  if (oldHost && oldHost.parentNode) oldHost.parentNode.removeChild(oldHost);
  elements["terminal-placeholder"].hidden = false;
  elements["terminal-actions"].hidden = true;
}

function disposeAllTerminals() {
  for (const entry of state.terminals.values()) {
    try { entry.handle.dispose(); } catch {}
    if (entry.host && entry.host.parentNode) entry.host.parentNode.removeChild(entry.host);
  }
  state.terminals.clear();
  state.terminal = null;
  elements["terminal-placeholder"].hidden = false;
  elements["terminal-actions"].hidden = true;
}

function toggleFullscreen() {
  state.fullscreen = !state.fullscreen;
  elements["terminal-frame"].classList.toggle("is-fullscreen", state.fullscreen);
}

function applySidebarState() {
  const layout = document.querySelector(".layout");
  const open = state.sidebarOpen;
  const isMobile = window.matchMedia("(max-width: 720px)").matches;
  layout.classList.toggle("sidebar-open", open);
  // In strip / open desktop modes the sidebar stays in the layout
  // (data-state="strip" or "open"). In mobile drawer mode it
  // is moved out of the layout via the small-viewport media
  // query (position: absolute).
  // The data-state attribute drives the CSS switch between
  // desktop strip / open and the mobile drawer.
  //   desktop closed -> "strip"  (48 px icon rail)
  //   desktop open   -> "open"   (240 px panel, default width)
  //   mobile  closed -> hidden=true
  //   mobile  open   -> "open" + position: absolute (drawer)
  elements["sidebar"].dataset.state = open ? "open" : "strip";
  elements["sidebar"].hidden = isMobile && !open;
  // Apply the saved width when open on desktop. The CSS default
  // 240 px kicks in for users that have never dragged the handle.
  const sidebar = elements["sidebar"];
  if (!isMobile && open) {
    sidebar.style.flex = `0 0 ${state.sidebarWidth}px`;
    sidebar.style.width = `${state.sidebarWidth}px`;
  } else {
    sidebar.style.flex = "";
    sidebar.style.width = "";
  }
  elements["sidebar-toggle"].setAttribute("aria-expanded", String(open));
  const railBtn = elements["sidebar-rail-toggle"];
  if (railBtn) {
    if (isMobile) {
      // On mobile the sidebar is an overlay drawer; the toggle
      // dismisses it, so show a close icon.
      railBtn.textContent = "×";
      railBtn.setAttribute("aria-label", open ? "Close presets" : "Open presets");
    } else {
      railBtn.textContent = open ? "«" : "»";
      railBtn.setAttribute("aria-label", open ? "Collapse presets" : "Expand presets");
    }
  }
}

// Drag the right edge of the sidebar to resize it. The new width is
// kept in state so it persists across toggle / preset switches.
function initSidebarResize() {
  const handle = elements["sidebar-resize"];
  if (!handle) return;
  let startX = 0;
  let startWidth = 0;
  const onMove = (event) => {
    const dx = event.clientX - startX;
    const next = Math.min(420, Math.max(160, startWidth + dx));
    state.sidebarWidth = next;
    const sidebar = elements["sidebar"];
    sidebar.style.flex = `0 0 ${next}px`;
    sidebar.style.width = `${next}px`;
  };
  const onUp = () => {
    handle.classList.remove("dragging");
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
  };
  handle.addEventListener("mousedown", (event) => {
    event.preventDefault();
    startX = event.clientX;
    startWidth = state.sidebarWidth;
    handle.classList.add("dragging");
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });
}

function toggleSidebar(force) {
  const open = force != null ? force : !state.sidebarOpen;
  state.sidebarOpen = open;
  applySidebarState();
}

elements["terminal-placeholder"].addEventListener("click", () => launch());
elements["close-terminal"].addEventListener("click", closeTerminal);
window.addEventListener("pagehide", disposeAllTerminals);
elements["restart-terminal"].addEventListener("click", async () => {
  await closeTerminal();
  launch();
});
elements["fullscreen-terminal"].addEventListener("click", toggleFullscreen);
elements["sidebar-toggle"].addEventListener("click", () => toggleSidebar());
elements["sidebar-rail-toggle"].addEventListener("click", () => toggleSidebar());
elements["new-preset-rail"].addEventListener("click", createPreset);

function createPreset() {
  const preset = { id: "custom-" + Date.now(), name: "Custom Crush", program: "/opfs/wanix/crush", type: "gojs", wd: "/opfs/home", icon: "bot", env: "", crushrc: "" };
  state.snapshot.presets.push(preset);
  state.selected = preset;
  // Open the sidebar so the new preset is visible and editable.
  if (!state.sidebarOpen) {
    state.sidebarOpen = true;
    applySidebarState();
  }
  renderPresets();
  const card = elements["preset-list"].lastElementChild;
  card.querySelector(".preset-toggle").click();
}

// Sidebar starts hidden on every viewport; the user opens it via
// the hamburger toggle. (It is drawn as a fixed/absolute drawer on
// small screens and an in-flow column on wide screens.)
initSidebarResize();
toggleSidebar(false);
// Keep sidebar visibility in sync when the viewport crosses the
// mobile/desktop breakpoint (the user can resize or rotate the
// window without ever clicking the toggle).
window.matchMedia("(max-width: 720px)").addEventListener("change", () => applySidebarState());

await refresh();
detect();
</script>
</body>
</html>
