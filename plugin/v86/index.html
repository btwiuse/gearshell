<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v86 — x86 Linux</title>
<link rel="stylesheet" href="/plugin/v86/v86.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.1.0-beta.304/css/xterm.css" />
<style>
  /* The bare-xterm host replaces the wanix-namespace/wanix-term selectors. */
  #v86-term {
    flex: 1;
    min-width: 0;
    min-height: 0;
    height: 100%;
  }
  #v86-term .xterm { height: 100%; }
</style>
</head>
<body>
  <div id="app">
    <header class="v86-head">
      <span class="v86-dots"><i></i><i></i><i></i></span>
      <span class="v86-title">v86 · Alpine Linux (x86)</span>
      <span id="v86-status" class="v86-status" data-mode="loading">loading…</span>
    </header>
    <div id="v86-host" class="v86-host">
      <div id="v86-term"></div>
    </div>
  </div>

  <script src="/plugin/gear-bridge.js"></script>
  <script>
    (function () {
      "use strict";

      // The VM runs in the HOST wanix kernel (the same instance the shell
      // and panels use): vm.create spawns it there and this page renders a
      // bare xterm that streams the VM's term device over the bridge. The
      // shared terminal-mount helper owns xterm/addons/resize/input; this
      // page keeps v86's VM asset config, status bar and ghostty transform.
      var MOUNT_BUNDLE = "/plugin/terminal-mount.mjs";
      var VNET_URL = "wss://vnet.net.k0s.io/x/net";
      // v86-specific assets live with the plugin (like rv64's ASSET_BASE),
      // not in the host app-constants: the archive is the x86 emulator
      // adapter, and the Linux rootfs is its guest image.
      var V86_BACKEND_URL =
        "https://cdn.jsdelivr.net/gh/btwiuse/wanix-extras@v0.4.0-rc3/v86.tgz";
      var V86_LINUX_URL =
        "https://cdn.jsdelivr.net/npm/wanix-extras@0.4.0-rc2/dist/wanix-linux.tgz";

      var state = {
        sessionId: null,
        handle: null,
        starting: false,
        retries: 0,
      };

      function $(id) { return document.getElementById(id); }

      function setStatus(mode, text) {
        var status = $("v86-status");
        status.dataset.mode = mode;
        status.textContent = text;
      }

      function writeToXterm(bytes) {
        if (state.handle && state.handle.term) state.handle.term.write(bytes);
      }

      // A minimal vm session facade: create() spawns the VM in the host
      // kernel (returns { sessionId }); write/resize/dispose mirror the
      // VM's term device on that same session.
      function vmSession(m) {
        var s = m.iframeSession(GearShell);
        s.create = function () {
          return GearShell.vm.create({
            backendUrl: V86_BACKEND_URL,
            linuxUrl: V86_LINUX_URL,
            netdev: "user,type=virtio,relay_url=" + VNET_URL,
            bootRc: "/plugin/v86/guest-boot-rc",
            postDhcp: "/plugin/v86/guest-post-dhcp",
          });
        };
        return s;
      }

      function start() {
        if (state.starting) return;
        state.starting = true;
        setStatus("loading", "starting…");
        import(MOUNT_BUNDLE).then(function (m) {
          return m.mountTerminal($("v86-term"), vmSession(m), {
            terminal: {
              fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
              fontSize: 13,
              scrollback: 10000,
              theme: {
                background: "#0a0e14",
                foreground: "#e6edf3",
                cursor: "#58a6ff",
                selectionBackground: "#1f6feb66",
              },
            },
            transformInput: function (data) {
              return data.replace(
                "\u001bP>|xterm.js(",
                "\u001bP>|ghostty(",
              );
            },
            onData: function () {
              if ($("v86-status").dataset.mode === "loading") {
                setStatus("ready", "ready · network connected");
              }
            },
            onExit: function (event) {
              if (event && event.error) {
                setStatus("error", "VM stopped: " + event.error);
              } else {
                setStatus("error", "VM stopped");
              }
            },
          }).then(function (handle) {
            state.handle = handle;
            state.sessionId = handle.sessionId;
            state.starting = false;
            setStatus("loading", "booting Alpine (x86)…");
          });
        }).catch(function (error) {
          state.starting = false;
          var msg = error && error.message ? error.message : String(error);
          // A permission-denied here is usually a one-off boot race: the
          // iframe's first vm.create can land before the sender resolves to
          // the registered v86 plugin (empty permit set -> deny), while a
          // retry a moment later picks up the real manifest. Self-heal with a
          // short bounded retry instead of failing the whole boot.
          if (/permission denied/i.test(msg) && state.retries < 5) {
            state.retries += 1;
            setStatus("loading", "retrying… (" + state.retries + ")");
            setTimeout(start, 1500);
            return;
          }
          state.retries = 0;
          console.error("v86 start failed", error);
          setStatus("error", "failed: " + msg);
          writeToXterm("\r\n\x1b[31mv86 failed to start: " + msg + "\x1b[0m\r\n");
        });
      }

      start();
    })();
  </script>
</body>
</html>
