<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotlight</title>
<!--
  spotlight/index.html — the Spotlight launcher, as an iframe plugin page.

  The shell hosts this page inside a full-viewport overlay iframe
  (spotlight-plugin.js). The iframe body is transparent and the backdrop
  is painted HERE, so the whole surface (backdrop + card) is owned by the
  plugin page: the shell only decides when the overlay is mounted.

  Everything this page needs comes over the gear-bridge postMessage API
  under the manifest's permissions.api whitelist:

    config.getShell()      -> launcherOrder / pinnedLauncherItems
    config.plugins.list()  -> installed apps (id, name, icon, enabled)
    panels.open(component) -> launch the picked app
    panels.list()          -> open panels, offered as "switch to" results

  Keyboard: type to filter, up/down to move, Enter to launch, Escape to
  close (the shell also closes on backdrop click and on the hotkey).
-->
<style>
  /* No backdrop here: the shell host paints the glass surface and
     positions the iframe at the card size. The iframe just renders
     the card, so its element stops clipping clicks at the card edge
     and the rest of the shell stays interactive. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #c9d1d9;
  }
  @keyframes sl-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sl-rise {
    from { opacity: 0; transform: translateY(-8px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  .sl-card {
    /* The shell iframe is enlarged by 2px and clipped at 14px radius,
       so the card body fills that clipped region and paints over any
       iframe subpixel seam along its own rounded border. */
    width: calc(100% - 4px);
    height: calc(100% - 4px);
    margin: 2px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 12px;
    border: 1px solid rgba(48, 54, 61, 0.6);
    background: rgba(22, 27, 34, 0.78);
    box-shadow:
      0 24px 64px rgba(0, 0, 0, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    animation: sl-rise 0.14s ease-out;
    box-sizing: border-box;
  }
  .sl-search {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #21262d;
    flex: 0 0 auto;
  }
  .sl-search svg { flex: 0 0 auto; color: #8b949e; }
  .sl-search input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #e6edf3;
    font-size: 19px;
    font-family: inherit;
  }
  .sl-search input::placeholder { color: #6e7681; }
  .sl-hint {
    flex: 0 0 auto;
    padding: 2px 6px;
    border: 1px solid #30363d;
    border-radius: 4px;
    color: #6e7681;
    font-size: 11px;
  }
  .sl-results { overflow-y: auto; padding: 6px; flex: 1 1 auto; }
  .sl-group-label {
    padding: 8px 10px 4px;
    color: #6e7681;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .sl-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }
  .sl-row:hover { background: #21262d; }
  .sl-row.is-active { background: #1f6feb; color: #fff; }
  .sl-row.is-active .sl-row-sub { color: rgba(255, 255, 255, 0.72); }
  .sl-row-icon {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: rgba(110, 118, 129, 0.18);
    font-size: 13px;
    font-weight: 600;
    color: #c9d1d9;
  }
  .sl-row-icon svg { display: block; }
  .sl-row.is-active .sl-row-icon { background: rgba(255, 255, 255, 0.18); color: #fff; }
  .sl-row-text { flex: 1 1 auto; min-width: 0; }
  .sl-row-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sl-row-sub { color: #8b949e; font-size: 12px; }
  .sl-row-pin { flex: 0 0 auto; color: #d29922; font-size: 12px; }
  .sl-empty { padding: 26px 16px; color: #8b949e; text-align: center; font-size: 14px; }
  .sl-error { padding: 26px 16px; color: #f85149; text-align: center; font-size: 13px; }
</style>
</head>
<body>
  <!-- No backdrop on the iframe side: the shell host paints the glass
       and clicks outside the card pass through to dockview. -->
  <div class="sl-card" id="sl-card" role="dialog" aria-modal="true" aria-label="Spotlight">
    <div class="sl-search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <input id="sl-input" type="text" placeholder="Search apps and panels…"
             autocomplete="off" spellcheck="false" aria-label="Search">
      <span class="sl-hint">esc</span>
    </div>
    <div class="sl-results" id="sl-results"></div>
  </div>

  <script src="/plugin/gear-bridge.js"></script>
  <script type="module" src="./spotlight.js"></script>
</body>
</html>
