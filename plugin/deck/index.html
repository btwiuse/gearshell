<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/theme/black.css">
  <link rel="stylesheet" href="./deck.css">
  <link rel="stylesheet" href="./reveal.css">
</head>
<body>
  <div id="home-content" class="home-content">
    <div class="reveal">
      <div class="slides"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/reveal.js"></script>
  <script>
    (async () => {
      const slides = document.querySelector(".slides");
      try {
        const response = await fetch("./slides.md");
        if (!response.ok) throw new Error(`Unable to load slides.md (${response.status})`);
        for (const source of (await response.text()).split(/^\s*--\s*$/m)) {
          const section = document.createElement("section");
          section.innerHTML = marked.parse(source);
          slides.append(section);
        }
        while (typeof window.Reveal === "undefined") {
          await new Promise((resolve) => setTimeout(resolve, 0));
        }
        const deck = new window.Reveal(document.querySelector(".reveal"), {
          hash: false,
          controls: true,
          progress: true,
          center: true,
          transition: "slide",
          backgroundTransition: "fade",
          keyboard: true,
          overview: true,
          touch: true,
          mouseWheel: true,
          scrollActivationWidth: null,
        });
        await deck.initialize();
      } catch (error) {
        const output = document.createElement("pre");
        output.textContent = error?.message || String(error);
        document.body.append(output);
      }
    })();
  </script>
</body>
</html>
