<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terminal</title>
<link rel="stylesheet" href="/plugin/terminal-frame/terminal-frame.css" />
<!-- xterm's stylesheet loads statically (CDN, same version as the
     kernel bundles); a dynamically-inserted link was flaky to apply on
     some deploys, so it lives in <head> like any other stylesheet. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.1.0-beta.304/css/xterm.css" />
</head>
<body>
  <!--
    Terminal — a full-bleed iframe terminal plugin.

    The shell owns the wanix kernel session (workspace-terminal-bridge.js,
    the vscode.Terminal-style data API); this page renders xterm and
    streams bytes over the iframe bridge. The frame around it mimics the
    Home demo frame: macOS traffic lights, a monospace title bar, a
    rounded border with a soft shadow — so the terminal reads as a real
    window inside the shell instead of a bare panel.

    Protocol used:
      terminal.create({})                -> { sessionId }
      terminal.write(id, Uint8Array)     -> input bytes
      terminal.resize(id, cols, rows)    -> winch update
      subscribe("term.data") / ("term.exit")
      term.data push -> xterm.write(bytes)
      term.exit push  -> show exit state

    xterm is imported from the CDN at the exact version the wanix kernel
    bundles; self-host these two files under this plugin dir for offline.
  -->

  <div id="frame" class="term-frame">
    <header id="titlebar" class="term-titlebar">
      <div class="term-traffic">
        <span class="term-dot term-dot-red"></span>
        <span class="term-dot term-dot-yellow"></span>
        <span class="term-dot term-dot-green"></span>
      </div>
      <div class="term-title" id="term-title">gear@gear: ~</div>
      <div class="term-actions">
        <span id="term-status" class="term-status" title="terminal status">
          <span id="term-status-dot" class="term-status-dot"></span>
          <span id="term-status-text">connecting</span>
        </span>
        <button id="term-restart" class="term-restart" type="button" title="Restart terminal">↻</button>
      </div>
    </header>

    <div id="term-progress" class="term-progress" hidden role="progressbar" aria-label="Terminal progress">
      <div id="term-progress-fill" class="term-progress-fill"></div>
    </div>
    <div id="term-host" class="term-host"></div>
    <div id="term-banner" class="term-banner" hidden></div>
  </div>

  <script src="/plugin/gear-bridge.js"></script>
  <script>
    (function () {
      "use strict";

      var XTERM_URL = "https://cdn.jsdelivr.net/npm/@xterm/xterm@6.1.0-beta.304/lib/xterm.mjs";
      var FIT_URL = "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.12.0-beta.301/lib/addon-fit.mjs";
      var PROGRESS_URL = "https://cdn.jsdelivr.net/npm/@xterm/addon-progress@0.3.0-beta.301/lib/addon-progress.mjs";

      var state = {
        sessionId: null,
        xterm: null,
        fit: null,
        progress: null,
        progressChange: null,
        disposed: true,
        sawData: false,
        resizeObserver: null,
        dataHandler: null,
        exitHandler: null,
      };

      function $(id) { return document.getElementById(id); }

      // Mobile tap-to-refocus: touch browsers may not synthesize the mousedown
      // xterm listens for after the terminal lost focus, so a tap would never
      // reopen the keyboard. Focus directly on a tap; scrolls are ignored.
      function enableTapFocus(term, host) {
        var touchStart = null;
        host.addEventListener("touchstart", function (event) {
          var t = event.changedTouches[0];
          if (t) touchStart = { x: t.clientX, y: t.clientY };
        }, { passive: true });
        host.addEventListener("touchend", function (event) {
          if (!touchStart) return;
          var t = event.changedTouches[0];
          var moved = t
            ? Math.abs(t.clientX - touchStart.x) + Math.abs(t.clientY - touchStart.y)
            : 0;
          touchStart = null;
          if (moved < 12) term.focus();
        }, { passive: true });
      }

      function setStatus(mode, text) {
        var bar = $("term-status");
        bar.dataset.mode = mode;
        $("term-status-dot").dataset.mode = mode;
        $("term-status-text").textContent = text;
      }

      function showBanner(text) {
        var banner = $("term-banner");
        banner.textContent = text;
        banner.hidden = false;
      }

      function hideBanner() {
        $("term-banner").hidden = true;
      }

      function updateProgress(progress) {
        var bar = $("term-progress");
        var fill = $("term-progress-fill");
        var stateValue = progress && progress.state;
        var value = Math.max(0, Math.min(100, Number(progress && progress.value) || 0));
        bar.hidden = stateValue === 0 || stateValue == null;
        bar.dataset.state = String(stateValue == null ? 0 : stateValue);
        fill.style.width = value + "%";
        bar.setAttribute("aria-valuenow", String(value));
        if (stateValue === 3) {
          bar.removeAttribute("aria-valuenow");
        }
      }

      function writeToXterm(bytes) {
        if (!state.xterm) return;
        try {
          state.xterm.write(bytes);
        } catch {
          // terminal already disposed
        }
      }

      function pushData(payload) {
        if (payload.sessionId !== state.sessionId) return;
        state.sawData = true;
        writeToXterm(payload.data);
        // First bytes prove the session is live; drop the stale
        // "waiting for output…" state the boot timer may have set.
        if (document.getElementById("term-status").dataset.mode === "waiting") {
          setStatus("connected", "session " + state.sessionId);
        }
      }

      function pushExit(payload) {
        if (payload.sessionId !== state.sessionId) return;
        var code = payload.code ?? "?";
        var note = payload.error ? "error: " + payload.error : "exit code " + code;
        setStatus("exited", "exited (" + code + ")");
        showBanner("Process " + note + " — restart to open a new session.");
        teardown();
      }

      function wireEvents() {
        state.dataHandler = pushData;
        state.exitHandler = pushExit;
        GearShell.on("term.data", state.dataHandler);
        GearShell.on("term.exit", state.exitHandler);
        return GearShell.subscribe("term.data")
          .then(function () { return GearShell.subscribe("term.exit"); });
      }

      function unwireEvents() {
        if (state.dataHandler) GearShell.off("term.data", state.dataHandler);
        if (state.exitHandler) GearShell.off("term.exit", state.exitHandler);
        state.dataHandler = null;
        state.exitHandler = null;
        GearShell.unsubscribe("term.data").catch(function () {});
        GearShell.unsubscribe("term.exit").catch(function () {});
      }

      function resizeTerminal() {
        if (!state.xterm || !state.sessionId) return;
        var host = $("term-host");
        GearShell.terminal.resize(
          state.sessionId,
          state.xterm.cols,
          state.xterm.rows,
          host.clientWidth || 0,
          host.clientHeight || 0,
        ).catch(function () { /* shell gone */ });
      }

      // The shell resizes this iframe (window resize or panel drag) but
      // xterm only learns its new size after a fit(); without this the
      // winch file keeps the boot dims and the kernel never sees a resize.
      // Mirrors wanix-term's _publishWinSize: fit, then send the winch
      // frame unconditionally (pixel-only changes still matter).
      function refitAndResize() {
        if (!state.xterm) return;
        // The shell may still be laying the panel out when the terminal
        // boots: the host can be 0-sized at that moment, fit() yields a
        // zero-column xterm and nothing renders until a later resize.
        // Skip zero sizes here; fitWhenReady/ResizeObserver re-run fit
        // once the host actually gets its real dimensions.
        if ($("term-host").clientWidth < 8 || $("term-host").clientHeight < 8) {
          return;
        }
        try {
          state.fit.fit();
        } catch {
          return;
        }
        resizeTerminal();
      }

      // Retry fit until the host has real dimensions (the panel may be
      // mid-layout when start() runs), then send the winch frame.
      function fitWhenReady() {
        if (!state.xterm) return;
        if ($("term-host").clientWidth < 8 || $("term-host").clientHeight < 8) {
          setTimeout(fitWhenReady, 200);
          return;
        }
        refitAndResize();
      }

      function teardown() {
        if (state.disposed) return;
        state.disposed = true;
        if (state.sessionId) {
          GearShell.terminal.dispose(state.sessionId).catch(function () {});
          state.sessionId = null;
        }
        unwireEvents();
        window.removeEventListener("resize", refitAndResize);
        if (state.resizeObserver) {
          state.resizeObserver.disconnect();
          state.resizeObserver = null;
        }
        state.progressChange?.dispose?.();
        state.progress?.dispose?.();
        state.progressChange = null;
        state.progress = null;
        updateProgress({ state: 0, value: 0 });
        if (state.xterm) {
          state.xterm.dispose();
          state.xterm = null;
          state.fit = null;
          $("term-host").innerHTML = "";
        }
      }

      function ensureXterm() {
        return import(XTERM_URL).then(function (mod) {
          return import(FIT_URL).then(function (fitMod) {
            return import(PROGRESS_URL).then(function (progressMod) {
              return {
                Terminal: mod.Terminal,
                FitAddon: fitMod.FitAddon,
                ProgressAddon: progressMod.ProgressAddon,
              };
            });
          });
        });
      }

      function start() {
        if (!state.disposed) return;
        teardown();
        state.disposed = false;
        state.sawData = false;
        hideBanner();
        setStatus("connecting", "starting…");
        ensureXterm()
          .then(function (libs) {
            var host = $("term-host");
            host.innerHTML = "";
            state.xterm = new libs.Terminal({
              termName: "ghostty",
              fontFamily: "ui-monospace, SFMono-Regular, Menlo, Monaco, monospace",
              fontSize: 14,
              lineHeight: 1.25,
              cursorBlink: true,
              convertEol: true,
              scrollback: 10000,
              theme: {
                background: "#0a0e14",
                foreground: "#e6edf3",
                cursor: "#58a6ff",
                selectionBackground: "#1f6feb66",
              },
            });
            state.fit = new libs.FitAddon();
            state.xterm.loadAddon(state.fit);
            state.progress = new libs.ProgressAddon();
            state.xterm.loadAddon(state.progress);
            state.progressChange = state.progress.onChange(function (progress) {
              updateProgress(progress);
            });
            state.xterm.open(host);
            enableTapFocus(state.xterm, host);
            // fitWhenReady (below) fits once the host has real dimensions;
            // an eager fit() at panel-layout time would size xterm to
            // 0 columns and the initial winch frame would be garbage.
            state.xterm.onData(function (data) {
              if (!state.sessionId) return;
              var response = data.replace(
                "\u001bP>|xterm.js(",
                "\u001bP>|ghostty(",
              );
              GearShell.terminal.write(state.sessionId, new TextEncoder().encode(response))
                .catch(function () {});
            });
            state.xterm.onResize(function () { resizeTerminal(); });
            window.addEventListener("resize", refitAndResize);
            // Panel drags and the initial layout settle resize the host
            // without a window resize; observe it directly (also covers
            // the 0-sized-boot case via fitWhenReady).
            if (typeof ResizeObserver !== "undefined") {
              state.resizeObserver = new ResizeObserver(refitAndResize);
              state.resizeObserver.observe($("term-host"));
            }
            fitWhenReady();
            return wireEvents();
          })
          .then(function () {
            return GearShell.terminal.create({});
          })
          .then(function (result) {
            if (result.ok === false) throw new Error(result.error || "create failed");
            state.sessionId = result.sessionId;
            setStatus("connected", "session " + result.sessionId);
            $("term-title").textContent = "gear@gear: ~  (" + result.sessionId + ")";
            resizeTerminal();
            // If the process produces nothing within a few seconds the
            // runtime is likely stalled (see the README note on large
            // gojs binaries); surface that instead of a dead black pane.
            // The timer is a fallback: once term.data has flowed it must
            // not override the connected state.
            setTimeout(function () {
              if (!state.disposed && state.sessionId && !state.sawData) {
                setStatus("waiting", "waiting for output…");
              }
            }, 8000);
          })
          .catch(function (error) {
            setStatus("exited", "failed");
            showBanner("Could not start the terminal: " + error.message);
            teardown();
          });
      }

      $("term-restart").addEventListener("click", start);

      // The bridge is only installed when this page runs inside an
      // iframe; opening the file directly is a safe no-op with a hint.
      if (!window.GearShell) {
        showBanner("gear-bridge.js did not load — open this page as an iframe panel.");
        setStatus("exited", "no bridge");
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
