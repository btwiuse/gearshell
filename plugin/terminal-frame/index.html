<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terminal</title>
<link rel="stylesheet" href="/plugin/terminal-frame/terminal-frame.css" />
<!-- xterm's stylesheet loads statically (CDN, same version as the
     kernel bundles); a dynamically-inserted link was flaky to apply on
     some deploys, so it lives in <head> like any other stylesheet. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.1.0-beta.304/css/xterm.css" />
</head>
<body>
  <!--
    Terminal — a full-bleed iframe terminal plugin.

    The shell owns the wanix kernel session (workspace-terminal-bridge.js,
    the vscode.Terminal-style data API); this page renders xterm and
    streams bytes over the iframe bridge. The frame around it mimics the
    Home demo frame: macOS traffic lights, a monospace title bar, a
    rounded border with a soft shadow — so the terminal reads as a real
    window inside the shell instead of a bare panel.

    Protocol used:
      terminal.create({})                -> { sessionId }
      terminal.write(id, Uint8Array)     -> input bytes
      terminal.resize(id, cols, rows)    -> winch update
      subscribe("term.data") / ("term.exit")
      term.data push -> xterm.write(bytes)
      term.exit push  -> show exit state

    xterm is imported from the CDN at the exact version the wanix kernel
    bundles; self-host these two files under this plugin dir for offline.
  -->

  <div id="frame" class="term-frame">
    <header id="titlebar" class="term-titlebar">
      <div class="term-traffic">
        <span class="term-dot term-dot-red"></span>
        <span class="term-dot term-dot-yellow"></span>
        <span class="term-dot term-dot-green"></span>
      </div>
      <div class="term-title" id="term-title">gear@gear: ~</div>
      <div class="term-actions">
        <span id="term-status" class="term-status" title="terminal status">
          <span id="term-status-dot" class="term-status-dot"></span>
          <span id="term-status-text">connecting</span>
        </span>
        <button id="term-restart" class="term-restart" type="button" title="Restart terminal">↻</button>
      </div>
    </header>

    <div id="term-progress" class="term-progress" hidden role="progressbar" aria-label="Terminal progress">
      <div id="term-progress-fill" class="term-progress-fill"></div>
    </div>
    <div id="term-host" class="term-host"></div>
    <div id="term-banner" class="term-banner" hidden></div>
  </div>

  <script src="/plugin/gear-bridge.js"></script>
  <script>
    (function () {
      "use strict";

      // The shared terminal-mount helper owns xterm construction, the addon
      // set, input/output wiring, resize (fit + winch with real pixels) and
      // tap-focus. This page keeps its frame: status bar + progress + ghostty
      // transform + restart + the "waiting for output" stall timer.
      var MOUNT_BUNDLE = "/plugin/terminal-mount.mjs";

      var state = {
        sessionId: null,
        handle: null,
        progress: null,
        progressChange: null,
        disposed: true,
        starting: false,
        sawData: false,
        stallTimer: null,
      };

      function $(id) { return document.getElementById(id); }

      function setStatus(mode, text) {
        var bar = $("term-status");
        bar.dataset.mode = mode;
        $("term-status-dot").dataset.mode = mode;
        $("term-status-text").textContent = text;
      }

      function showBanner(text) {
        var banner = $("term-banner");
        banner.textContent = text;
        banner.hidden = false;
      }

      function hideBanner() {
        $("term-banner").hidden = true;
      }

      function updateProgress(progress) {
        var bar = $("term-progress");
        var fill = $("term-progress-fill");
        var stateValue = progress && progress.state;
        var value = Math.max(0, Math.min(100, Number(progress && progress.value) || 0));
        bar.hidden = stateValue === 0 || stateValue == null;
        bar.dataset.state = String(stateValue == null ? 0 : stateValue);
        fill.style.width = value + "%";
        bar.setAttribute("aria-valuenow", String(value));
        if (stateValue === 3) {
          bar.removeAttribute("aria-valuenow");
        }
      }

      function teardown() {
        // Force a full clear whether or not the session already exited
        // (an exited session leaves the terminal + handle in place so the
        // restart can read the last output; start() re-invokes teardown
        // to release them before opening a fresh session).
        state.disposed = true;
        if (state.stallTimer) {
          clearTimeout(state.stallTimer);
          state.stallTimer = null;
        }
        if (state.handle) {
          try {
            state.handle.dispose();
          } catch {
            // already disposed
          }
          state.handle = null;
        }
        state.sessionId = null;
        state.progressChange?.dispose?.();
        state.progress?.dispose?.();
        state.progressChange = null;
        state.progress = null;
        updateProgress({ state: 0, value: 0 });
        var host = $("term-host");
        if (host) host.innerHTML = "";
      }

      function start() {
        if (state.starting) return;
        state.starting = true;
        teardown();
        state.disposed = false;
        state.sawData = false;
        hideBanner();
        setStatus("connecting", "starting…");
        $("term-host").innerHTML = "";
        import(MOUNT_BUNDLE).then(function (m) {
          return m.mountTerminal($("term-host"), m.iframeSession(GearShell), {
            terminal: {
              termName: "ghostty",
              fontFamily: "ui-monospace, SFMono-Regular, Menlo, Monaco, monospace",
              fontSize: 14,
              lineHeight: 1.25,
              scrollback: 10000,
              theme: {
                background: "#0a0e14",
                foreground: "#e6edf3",
                cursor: "#58a6ff",
                selectionBackground: "#1f6feb66",
              },
            },
            // The helper already loads the shared ProgressAddon (a pure OSC
            // 9;4 escape listener that renders nothing). This page loads its
            // own so it can onChange() the bar; xterm chains multiple handlers
            // per OSC number, so both coexist and only this one renders.
            setupAddons: function (term, libs) {
              state.progress = new libs.ProgressAddon();
              term.loadAddon(state.progress);
              state.progressChange = state.progress.onChange(function (progress) {
                updateProgress(progress);
              });
            },
            transformInput: function (data) {
              return data.replace(
                "\u001bP>|xterm.js(",
                "\u001bP>|ghostty(",
              );
            },
            onData: function () {
              state.sawData = true;
              // First bytes prove the session is live; drop the stale
              // "waiting for output…" state the stall timer may have set.
              if ($("term-status").dataset.mode === "waiting") {
                setStatus("connected", "session " + state.sessionId);
              }
            },
            onExit: function (payload) {
              var code = payload.code ?? "?";
              var note = payload.error ? "error: " + payload.error : "exit code " + code;
              setStatus("exited", "exited (" + code + ")");
              showBanner("Process " + note + " — restart to open a new session.");
              // Mark idle so the restart button can start() again, but do
              // NOT dispose yet: keep the last output on screen until the
              // user restarts (start()'s teardown() then releases it).
              state.disposed = true;
            },
            exitMessage: false, // the banner above owns the exit notice
          }).then(function (handle) {
            state.starting = false;
            state.handle = handle;
            state.sessionId = handle.sessionId;
            setStatus("connected", "session " + handle.sessionId);
            $("term-title").textContent = "gear@gear: ~  (" + handle.sessionId + ")";
            // If the process produces nothing within a few seconds the
            // runtime is likely stalled (see the README note on large gojs
            // binaries); surface that instead of a dead black pane. The
            // timer is a fallback: once term.data has flowed it must not
            // override the connected state.
            state.stallTimer = setTimeout(function () {
              if (!state.disposed && state.sessionId && !state.sawData) {
                setStatus("waiting", "waiting for output…");
              }
            }, 8000);
          });
        }).catch(function (error) {
          state.starting = false;
          setStatus("exited", "failed");
          showBanner("Could not start the terminal: " + error.message);
          teardown();
        });
      }

      $("term-restart").addEventListener("click", start);

      // The bridge is only installed when this page runs inside an
      // iframe; opening the file directly is a safe no-op with a hint.
      if (!window.GearShell) {
        showBanner("gear-bridge.js did not load — open this page as an iframe panel.");
        setStatus("exited", "no bridge");
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
